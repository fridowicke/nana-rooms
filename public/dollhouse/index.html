<style>
/* loading screen: only the small dollhouse gif on white, from the first paint until the scene layers and tray stickers are decoded, then fades out (300 ms).
   Shown at the size of the hub's welcome gif: 124 px wide on desktop, 104 px on phones. */
#loader{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#loader img{display:block;width:124px;height:auto;image-rendering:pixelated}
@media (max-width:768px){#loader img{width:104px}}
#loader.out{opacity:0;pointer-events:none}
#loader{flex-direction:column;gap:14px}
/* "tap to enter ♡": only when the browser blocks the song's autoplay; the tap starts the song, then the game is revealed */
#enter{display:none;padding:6px 18px;border:1px solid #f4a7c8;border-radius:999px;background:linear-gradient(#fff,#ffe3ef);color:#e0579a;
  font:300 13px/1.2 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;letter-spacing:.06em;box-shadow:0 1px 0 #fff inset,0 2px 6px rgba(240,120,170,.25);
  cursor:pointer;animation:enterPulse 1.4s ease-in-out infinite}
#loader.ask #enter{display:block}
@keyframes enterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
</style>

document.write('<link rel="preload" as="image" href="layers/'+d+'background-wall.webp" type="image/webp">')})()</script>

<style>
/* Layout: the scene (separate picture layers on an 8800 × 4946 artboard, 16:9) fitted above the sticker sheet. Black on white, square corners. */
:root{
  --bg:#ffffff; --ink:#000000; --dim:rgba(0,0,0,.35); --faint:rgba(0,0,0,.05); --muted:#666666;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:max(4px,env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
*{border-radius:0}
.app{position:relative;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:0;min-height:0}
/* the header floats over the top of the wall so the scene can start at the top edge of the window */
header{position:absolute;top:6px;left:0;right:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:nowrap}
.hud{pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;line-height:1.3}
#progress{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--bg);border:1px solid var(--ink);padding:3px 8px;font-size:12px;line-height:1.3}
.btn:hover,.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* scene: 16:9 (8800 × 4946), cover-fitted to the area above the sheet: scale = max(window width / 8800, area height / 4946),
   centred horizontally, bottom-aligned (floor and house never cut, only the top of the wall or the sides may be cropped).
   The area spans the full window width (out of the body padding). Each layer = layers/<name>.webp placed in % of the artboard
   (left x/8800, top y/4946, width w/8800), stacked by z, so every layer, sticker and editor handle shares one scale and offset */
.stageWrap{position:relative;width:100vw;margin-left:calc(50% - 50vw);flex:none;height:calc(100% - var(--tbh,0px));min-height:0;container-type:size;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.scene{position:relative;z-index:0;flex:none;width:max(100vw,calc((100dvh - 120px) * 8800 / 4946));width:max(100cqw,100cqh * 8800 / 4946);aspect-ratio:8800/4946}
.ly{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.ly.vin{opacity:0;transition:opacity .25s ease}
/* colour variant button: in .app, 12px above the top of the sticker toolbar (--tbr = its real height, set in fitSheet), under the editor panel (z 20) */
.varBtn{position:absolute;left:calc(50% - 50vw + 12px);bottom:calc(var(--tbr,0px) + 12px);z-index:15;width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);padding:0;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.varBtn:hover{background:var(--ink)}
.varBtn.busy{cursor:progress}
.varBtn.busy::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--ink);animation:varSpin .7s linear infinite;pointer-events:none}
@keyframes varSpin{to{transform:rotate(360deg)}}
/* the game area = the box of the house layer; stickers live in its units (VB). z 30 = above every scene layer (house, stairs, girl,
   legs, mailbox, items: z ≤ 21, raised layers in the editor 29), so dropped stickers always stay in front; the sheet and editor UI are above the scene */
.stage{position:absolute;z-index:30}
.sheet{position:relative;z-index:1;background:var(--bg)}
.layer{position:absolute;inset:0;width:100%;height:100%}
.screens{position:absolute;inset:0;pointer-events:none;z-index:1}
/* room videos fill their room box edge to edge (cover, centre 45%): the top and bottom of the film are cropped so no wallpaper
   shows around it; the box bleeds 1 px past the room box on every side (boxStyle) so no thin strip remains at the walls. */
.screens video{position:absolute;display:block;object-fit:cover;object-position:center 45%;opacity:0;transition:opacity .7s ease;background:transparent}
/* never show the browser's own play buttons / controls on the room videos (Safari shows a round PLAY when autoplay is blocked) */
.screens video::-webkit-media-controls,.screens video::-webkit-media-controls-start-playback-button,
.screens video::-webkit-media-controls-overlay-play-button,.screens video::-webkit-media-controls-panel,
.screens video::-webkit-media-controls-enclosure{display:none !important;-webkit-appearance:none;opacity:0;pointer-events:none}
.screens .on{opacity:1}
.stage .tag{position:absolute;z-index:2;pointer-events:none;margin:4px;padding:1px 4px;background:var(--ink);color:var(--bg);font-size:10px;line-height:1.3;white-space:nowrap}
.zone{fill:transparent;stroke:none;transition:fill .15s}
.zone.hot{fill:var(--faint)}
.walls{position:absolute;inset:0;pointer-events:none}
.walls image{pointer-events:auto;touch-action:none;cursor:grab}
.walls image.lift{opacity:.25}
.walls image.pop{animation:fade .3s ease-out}
.walls image{transition:opacity .7s ease}
.walls image.gone,.placed img.gone{opacity:0;pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alive .walls image{cursor:default}
.placed{position:absolute;inset:0;pointer-events:none}
.placed img{pointer-events:auto;position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;-webkit-user-drag:none;transition:left .25s ease,top .25s ease,opacity .7s ease}
.placed img.lift{opacity:.25;transition:none}
.placed img.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.9)}to{opacity:1;transform:translate(-50%,-100%)}}
.alive .placed img{cursor:default}

/* sticker sheet: fixed over the bottom of the window, above the scene, below the editor UI. The scene area is always the window
   minus the sheet height at the DEFAULT sizes (--tbh, see renderSheet), so a bigger toolbar or bigger tray items just cover more of the scene */
.sheet{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(4px,env(safe-area-inset-bottom,0px));--t:22px;--o:-4px;flex:0 0 auto;max-height:calc(17vh * var(--tb,1));max-height:calc(17dvh * var(--tb,1));overflow:hidden;box-sizing:border-box;padding:2px 2px 2px 6px;margin:0;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-start;gap:1px;transition:opacity .3s}
.sheet.locked{opacity:.3;pointer-events:none}
/* desktop (>860px, editor too): the tray is flush with the bottom corners and its items are spread evenly from the left to the right edge in one row (fitSheet shrinks --t if they don't fit) */
@media (min-width:861px){ .sheet{left:0;right:0;bottom:0;flex-wrap:nowrap;justify-content:space-between;padding:2px 4px} .sheet .sticker{flex:none;margin-left:0} .varBtn{bottom:calc(var(--tbr,0px) + 8px)} }
.sticker{position:relative;border:0;padding:0;margin:0 0 0 var(--o);display:grid;place-items:end center;background:transparent;touch-action:none;cursor:grab;min-width:0;transition:opacity .15s,transform .15s}
.sticker:hover{opacity:.75;transform:scale(1.04)}
.sticker:active{transform:scale(.97)}
.sticker img{display:block;pointer-events:none;-webkit-user-drag:none;height:var(--t);width:auto}
.sticker.used{display:none}
.del{position:absolute;top:0;right:0;width:9px;height:9px;padding:0;display:grid;place-items:center;background:none;border:0;color:var(--ink);font-size:8px;line-height:1;cursor:pointer;touch-action:none;z-index:1}
.del::before{content:"";position:absolute;inset:0;background:var(--bg,#fff);border:1px solid var(--dim);z-index:-1}
.del:hover::before{border-color:var(--ink)}
.add{border:0;margin-left:2px;color:var(--muted);font-size:14px;width:var(--t);height:var(--t);display:grid;place-items:center;position:relative;cursor:pointer;transition:opacity .15s,transform .15s}
.add:hover{color:var(--ink);transform:scale(1.04)}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.types{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:1px;z-index:1;pointer-events:none}
.types span{width:8px;height:8px;box-sizing:border-box;display:grid;place-items:center;font-size:6px;line-height:1;padding:0;border:1px solid var(--dim);color:var(--muted);background:var(--bg);cursor:pointer;touch-action:none;pointer-events:auto}
.types span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ownerLine{flex:1 1 100%;margin:0;font-size:10px;line-height:1.2;color:var(--muted)}
.ownerLine a{color:inherit;cursor:pointer;text-decoration:underline}
.emptyNote{color:var(--muted);margin:0;align-self:center;flex:1 1 200px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
.ghost.back{transition:all .25s ease-in}
/* editor (?edit=1): every layer can be picked; zoom resizes the scene (sharp pictures), pan moves it */
.editing .stageWrap{cursor:default}
.editing .scene{width:calc(max(100cqw,100cqh * 8800 / 4946) * var(--zoom,1))}
.editing .stage *{pointer-events:none!important}
#selLayer{position:absolute;inset:0;pointer-events:none;z-index:40}
#selLayer .ol{position:absolute;outline:1px dashed rgba(0,0,0,.45)}
#selLayer .box{position:absolute;outline:1px solid var(--ink)}
#selLayer .h{position:absolute;width:10px;height:10px;background:var(--bg);border:1px solid var(--ink);box-sizing:border-box;transform:translate(-50%,-50%);pointer-events:auto}
#selLayer .h[data-h=nw],#selLayer .h[data-h=se]{cursor:nwse-resize}
#selLayer .h[data-h=ne],#selLayer .h[data-h=sw]{cursor:nesw-resize}
.etools{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--ink);padding:3px 6px;font-size:12px;line-height:1.3;white-space:nowrap}
.etools input[type=range]{width:120px}
.etools .st{color:var(--muted)}
.sheet .sticker.tsel{outline:1px solid var(--ink);outline-offset:1px}
.epanel{position:fixed;right:6px;top:40px;z-index:20;width:240px;max-width:calc(100vw - 12px);max-height:min(70vh,calc(100vh - 48px));display:flex;flex-direction:column;background:rgba(255,255,255,.85);border:1px solid var(--ink);font-size:10px;line-height:1.25;box-sizing:border-box;transition:opacity .15s,background .15s}
.epanel:hover{background:var(--bg)}
.epanel.left{right:auto;left:6px}
.epanel.collapsed{display:none}
body.edrag .epanel,body.edrag .epanelBtn{pointer-events:none;opacity:.25}
.epanel .ehead{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 6px;border-bottom:1px solid var(--ink);cursor:move;user-select:none;touch-action:none;flex:none}
.epanel .ehead b{flex:1;font-weight:400}
.epanel .ehead .btn{font-size:10px;padding:0 5px;cursor:pointer}
.epanel .ebody{overflow:auto;padding:4px 6px 6px;display:flex;flex-direction:column;gap:3px;min-height:0}
.epanel details{border-top:1px solid var(--faint)}
.epanel details>div{display:flex;flex-direction:column;gap:4px;padding:2px 0 4px}
.epanel summary{cursor:pointer;padding:2px 0;color:var(--ink)}
.epanel h4{margin:2px 0 0;font-size:10px;font-weight:400;color:var(--muted)}
.epanel .ll{display:flex;flex-direction:column;max-height:28vh;overflow:auto;border:1px solid var(--faint)}
.epanel .ll label{display:flex;align-items:center;gap:4px;padding:0 3px;cursor:pointer;white-space:nowrap}
.epanel .ll label.on{background:var(--ink);color:var(--bg)}
.epanel .ll input{margin:0}
.epanel .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.epanel .nums input,.epanel input[type=number]{width:100%;box-sizing:border-box;font:inherit;font-size:10px;padding:1px 2px;border:1px solid var(--dim)}
.epanel .row{display:flex;align-items:center;gap:4px}
.epanel .row input[type=range]{flex:1;min-width:0}
.epanel .row input[type=number]{width:48px;flex:none}
.epanel .btn{font-size:10px;padding:1px 5px}
.epanel .btn.big{font-size:14px;padding:0 8px;line-height:1.2;flex:none}
.epanel .wrapRow{flex-wrap:wrap}
.epanelBtn{position:fixed;right:6px;top:40px;z-index:20;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);font-size:12px;line-height:1;padding:0;cursor:pointer;display:none}
.epanelBtn.left{right:auto;left:6px}
.epanelBtn.on{display:block}
.editing .placed img{transition:opacity .7s ease}
@media (max-width:860px){ header{flex-wrap:wrap;row-gap:4px} }
/* phones: same cover-fitted scene above the sheet */
@media (max-width:700px){
  body{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .sheet{padding:2px 0 2px 4px;left:max(4px,env(safe-area-inset-left,0px));right:max(4px,env(safe-area-inset-right,0px))}
}
/* portrait phones / tablets: the scene is fitted by WIDTH to the whole house group (mailbox … girl and her bubble = artboard x 1647…7682,
   6035 wide, centre 4664.5) instead of cover, so nothing of the house is cut; it stays bottom-aligned above the sheet. The wall above is
   continued by a mirrored copy of the upper 70% of the wall layer (--wall, set with the colour variant; the lower 30% is the skirting),
   then by that 70% row stretched upwards (vertical stripes), so there is never a white gap. */
@media (max-aspect-ratio:1/1){
  .scene{width:calc(100cqw * 8800 / 6035);left:calc(100cqw * -264.5 / 6035)}
  .scene::before,.scene::after{content:"";position:absolute;left:.0114%;width:100%;pointer-events:none}
  .scene::before{z-index:-1;bottom:calc(100% + 100% * 95 / 4946);height:calc(70% * 4004 / 4946);
    background:var(--wall) 0 0/100% calc(100% / .7) no-repeat;transform:scaleY(-1)}
  .scene::after{z-index:-2;bottom:calc(100% + 100% * 95 / 4946 + 70% * 4004 / 4946 - 1px);height:400%;background:var(--wall) 0 70%/100% 100000% no-repeat}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* song player: a 240×135 px macOS "Tiny Player" window pinned in the top-left corner (fixed px, not scaled with the house; above the scene,
   below the avatar and her bubble, z 18). Hidden until the loading screen is gone, then it tries to autoplay (see the script at the end). */
.song{position:fixed;top:6px;left:6px;z-index:17;width:240px;height:135px;box-sizing:border-box;display:none;flex-direction:column;overflow:hidden;
  background:#f5f5f5;border:1px solid #c8c8c8;border-radius:7px;box-shadow:0 3px 12px rgba(0,0,0,.22),0 0 1px rgba(0,0,0,.25);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#333;line-height:1.2;
  transform:scale(.5);transform-origin:top left} /* zoomed out 2x as a whole: shows as 120×67.5 px, top-left corner stays at 6px/6px */
.song.on{display:flex}
.song .tb{position:relative;flex:none;height:17px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e8e8e8,#d2d2d2);
  border-bottom:1px solid #bdbdbd;border-radius:6px 6px 0 0;cursor:default}
.song .dots{position:absolute;left:6px;top:5px;display:flex;gap:4px;border-radius:0}
.song .dots i{width:7px;height:7px;border-radius:50%;box-sizing:border-box;border:.5px solid rgba(0,0,0,.18)}
.song .dots .r{background:#ff5f57;cursor:pointer}.song .dots .y{background:#febc2e}.song .dots .g{background:#28c840}
.song .tt{font-size:8px;font-weight:600;color:#4a4a4a}
.song .bd{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-radius:0;text-align:center}
.song .trk{font-size:9px;font-weight:700;color:#222}
.song .art{font-size:8px;color:#8a8a8a;margin-top:1px}
.song .ctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 5px}
.song .ctl button{padding:0;border:0;background:none;display:grid;place-items:center;color:#333;border-radius:0}
.song .ctl button{position:relative}
/* invisible bigger touch target for play/pause (the player is drawn at half size) */
.song #songBtn::before{content:"";position:absolute;inset:-12px -8px}
.song .ctl button:disabled{opacity:.3;cursor:default}
.song .ctl svg{display:block;fill:currentColor}
.song #songBtn .pa,.song.playing #songBtn .pl{display:none}.song.playing #songBtn .pa{display:block}
.song .bar{position:relative;height:9px;cursor:pointer;touch-action:none;border-radius:0}
.song .bar::before{content:"";position:absolute;left:0;right:0;top:3px;height:3px;background:#ccc;border-radius:2px}
.song .fill{position:absolute;left:0;top:3px;height:3px;width:0;background:#4a90d9;border-radius:2px}
.song .knob{position:absolute;top:0;left:0;width:9px;height:9px;box-sizing:border-box;margin-left:-4.5px;background:#fff;border:1.5px solid #4a90d9;border-radius:50%}
.song .tm{display:flex;justify-content:space-between;font-size:8px;color:#8a8a8a;font-variant-numeric:tabular-nums;margin-top:1px;border-radius:0}
.song .st{flex:none;height:14px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;background:#e4e4e4;border-top:1px solid #cfcfcf;
  border-radius:0 0 6px 6px;font-size:8px;color:#777}
/* red dot: only the title bar stays, clicking the title bar opens it again */
.song.min{height:auto}.song.min .bd,.song.min .st{display:none}.song.min .tb{border-bottom:0;border-radius:6px;cursor:pointer}
/* back link to the folders desktop (../#about, no intro there): the site's pink bear gif with the "Back" bubble (../assets/go-back.gif,
   GO_BACK_GIF in App.jsx), lower-right corner just above the sticker tray (--tbr, set in fitSheet) so it never covers tray items */
.back{position:fixed;right:10px;bottom:calc(var(--tbr,0px) + 8px + env(safe-area-inset-bottom,0px));z-index:17;display:none;min-width:44px;min-height:44px;padding:0 1px;box-sizing:border-box;border:0;background:transparent;line-height:0;
  isolation:isolate;transform:translateZ(0);will-change:transform} /* own compositing layer: stays painted above the scene videos (WebKit), still under the avatar (z 18) and the loader (z 1000) */
.song.on~.back{display:block}
.back img{display:block;width:42px;height:auto;image-rendering:pixelated}
/* phones: the Random / Reset / counter row needs the top edge, so the player sits just below it */
@media (max-width:470px){.song{top:36px}}
/* phones held sideways (short and not desktop-wide: height < 500px, landscape, width < 1000px): the whole 16:9 scene is fitted by HEIGHT
   above a compact one-row tray, centred, so the house, the lowest row and the floor are never cut; the strips left and right of it
   continue the wall and floor as mirrored copies of their outer edges (--wall/--floor/--splash). Player, Back and tray clear the notch. */
@media (max-height:499px) and (orientation:landscape) and (max-width:999px){
  .scene{width:min(100cqw,100cqh * 8800 / 4946)}
  .scene::before,.scene::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;width:calc(50cqw - 50% + 2px);pointer-events:none;transform:scaleX(-1);
    background:var(--splash) 0 100%/calc(100cqh * 8800 / 4946) calc(100% * 1281 / 4946) no-repeat,var(--floor) 0 100%/calc(100cqh * 8800 / 4946) calc(100% * 1274 / 4946) no-repeat,
      var(--wall) 0 0/calc(100cqh * 8800 / 4946) calc(100% * 4004 / 4946) no-repeat}
  .scene::before{right:calc(100% - 1px)}
  .scene::after{left:calc(100% - 1px);background-position:100% 100%,100% 100%,100% 0}
  .sheet{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(2px,env(safe-area-inset-bottom,0px));
    max-height:40px;flex-wrap:nowrap;justify-content:space-between;padding:1px 2px}
  .sheet .sticker{flex:none;margin-left:0}
  .song{left:max(6px,env(safe-area-inset-left,0px))}
  .back{right:max(10px,env(safe-area-inset-right,0px))}

<script>
/* =====================================================================
   SETTINGS
   ---------------------------------------------------------------------
   STICKERS: the tray holds only the item-*.webp layers of layers/ (no uploads, no pieces/ files).
   WALLPAPER vs OBJECT is decided by the picture itself: a picture with no transparency (a normal photo,
     JPG or opaque PNG) is a wallpaper; a cut-out PNG with transparent parts is an object.
     A file name starting with "wall" (wall_something.png) is always a wallpaper.
     Dropped on a room or the tower it covers that whole area behind the furniture; one per area,
     a new one sends the old one back to the sheet.
   Objects stay exactly where they are dropped (centre under the finger), anywhere on the stage.
   SLOTS: a picture whose file name contains "door" or "window" dropped on (or next to) the door or a tower window
     of the house snaps into it; one picture per slot. Anywhere else it is a normal object.
   ===================================================================== */
/* FINALE: when the house is dressed every room listed here plays its video at the same time, cut to the room
   and covering it; the stickers and wallpaper of those rooms fade out while they play. Other rooms keep their objects.
   One line per room r1..r8, file number = room number (videos/room-rN.mp4). To add a video, put the file in videos/
   and uncomment its room's line; commented rooms request nothing. The tower gets no video.
   (r1 r2 = top floor left/right, r3 r4 = 2nd floor, r5 r6 = 3rd floor, r7 r8 = ground floor) */
/* playback speed of every room video: the b/w films were shot at about 16-18 fps but are stored as 24 fps, so at 1
   they look sped up. 0.75 ≈ 18 fps feel; 1 = file speed, smaller = slower. */
const ROOM_VIDEO_SPEED = 0.75;
const ROOM_VIDEOS = {
  r1: "videos/room-r1.mp4",      // b/w film: shot_030
  r2: "videos/room-r2.mp4",      // b/w film: shot_043
  r3: "videos/room-r3.mp4",      // b/w film: shot_044, the mirror
  r4: "videos/room-r4.mp4",      // b/w film: shot_045 (1), two dolls in a bed
  r5: "videos/room-r5.mp4",      // b/w film: shot_045
  r6: "videos/room-r6.mp4",      // b/w film: shot_048
  r7: "videos/room-r7.mp4",      // b/w film: roomvid7
  r8: "videos/room-r8.mp4",      // b/w film: roomvid8
};

/* SCENE: layers/<name>.webp on an 8800 × 4946 artboard (the files are drawn at 50 %); x, y = top-left, w, h = size, z = stacking
   (higher is in front). item-* layers are not part of the scene: they are the first stickers on the sheet, at their artboard size. */
const ART={w:8800,h:4946}, HIDDEN=["outlet-left"];
const DEFAULT_LAYERS=[{"name":"background-wall","group":"background","z":0,"x":0,"y":0,"w":8800,"h":4004},{"name":"floor","group":"background","z":1,"x":0,"y":3672,"w":8800,"h":1274},{"name":"floor-splashes","group":"background","z":2,"x":0,"y":3665,"w":8800,"h":1281},{"name":"leg-left","group":"scene","z":8,"x":900,"y":0,"w":1725,"h":3771},{"name":"leg-right","group":"scene","z":8,"x":5096,"y":0,"w":2840,"h":3804},{"name":"outlet-left","group":"background","z":-1,"x":1268,"y":1713,"w":708,"h":1145},{"name":"outlet-right","group":"background","z":3,"x":6843,"y":743,"w":708,"h":1145},{"name":"outside-stairs","group":"scene","z":4,"x":2223,"y":1512,"w":391,"h":2245},{"name":"house","group":"scene","z":5,"x":2453,"y":784,"w":3097,"h":3040},{"name":"girl","group":"scene","z":9,"x":5625,"y":1401,"w":1060,"h":2422},{"name":"speech-bubble","group":"scene","z":10,"x":4747,"y":232,"w":2056,"h":1365},{"name":"mailbox","group":"scene","z":11,"x":5476,"y":3458,"w":172,"h":414},{"name":"item-audiocontroller","group":"toolbar-item","z":20,"x":3870,"y":2457,"w":261,"h":88},{"name":"item-bearbrick-copy","group":"toolbar-item","z":20,"x":3893,"y":1697,"w":166,"h":355},{"name":"item-cage","group":"toolbar-item","z":20,"x":3001,"y":2765,"w":180,"h":359},{"name":"item-car","group":"toolbar-item","z":20,"x":2745,"y":2266,"w":654,"h":328},{"name":"item-cdp","group":"toolbar-item","z":20,"x":3672,"y":2739,"w":186,"h":371},{"name":"item-ipod-nano-pink","group":"toolbar-item","z":20,"x":3922,"y":3291,"w":166,"h":383},{"name":"item-lamp-1","group":"toolbar-item","z":20,"x":3964,"y":2121,"w":378,"h":249},{"name":"item-lamp-2","group":"toolbar-item","z":20,"x":2781,"y":2663,"w":91,"h":253},{"name":"item-lamp-2-copy","group":"toolbar-item","z":20,"x":3725,"y":1608,"w":91,"h":253},{"name":"item-lamp-3","group":"toolbar-item","z":20,"x":2719,"y":1580,"w":378,"h":249},{"name":"item-lamp-copy","group":"toolbar-item","z":20,"x":3996,"y":2763,"w":372,"h":355},{"name":"item-pc","group":"toolbar-item","z":20,"x":4239,"y":2984,"w":106,"h":141},{"name":"item-radio","group":"toolbar-item","z":20,"x":3661,"y":2317,"w":200,"h":234},{"name":"item-skull","group":"toolbar-item","z":20,"x":3100,"y":1748,"w":340,"h":308},{"name":"item-tv","group":"toolbar-item","z":20,"x":2725,"y":3423,"w":313,"h":242},{"name":"item-tv-2","group":"toolbar-item","z":20,"x":4074,"y":1810,"w":335,"h":247},{"name":"item-window","group":"toolbar-item","z":20,"x":3919,"y":1629,"w":196,"h":304},{"name":"item-window-copy-2","group":"toolbar-item","z":20,"x":2994,"y":3247,"w":196,"h":304}];
let LAYERS=DEFAULT_LAYERS.map(l=>({...l}));
// sticker tray sizes (dollhouse-layout.json: toolbarScale = tray height, trayItemsScale = all items, trayItems = {layer name: scale})
const DEFAULT_TRAY={toolbarScale:1,trayItemsScale:1,trayItems:{}};
let TRAY={...DEFAULT_TRAY,trayItems:{}};
const trayKey=it=>it.upload?null:it.name.replace(/\.webp$/,"");
const trayScaleOf=it=>TRAY.trayItemsScale*((trayKey(it)&&TRAY.trayItems[trayKey(it)])||1);
const isItem=name=>/^item-/.test(name);

const STICKERS = [
  ...DEFAULT_LAYERS.filter(l=>isItem(l.name)).map(l=>({src:`layers/${l.name}.webp`, h:l.h, art:true})),
];

// House geometry = artboard units inside the house layer (house.webp at 3097 × 3040). 4 floors × 2 rooms + the tower above the door;
// a wallpaper covers one of these areas. K = old room height (162) → new, keeps sticker sizes relative to a room.
const ROOMS = [
  {id:"r1",x:128,y:768, w:910,h:488},{id:"r2",x:1066,y:768, w:948,h:488},
  {id:"r3",x:128,y:1328,w:910,h:468},{id:"r4",x:1066,y:1328,w:948,h:468},
  {id:"r5",x:128,y:1872,w:910,h:436},{id:"r6",x:1066,y:1872,w:948,h:436},
  {id:"r7",x:128,y:2426,w:910,h:416},{id:"r8",x:1066,y:2426,w:948,h:416},
];
const K = 488/162;

// the middle pillar / tower wall, underside of the ceiling or shelf above down to the front edge of the floor (the line where the
// floor meets the shelf front / base), so the film covers the wallpaper, the skirting and the floor of its room
const VIDEO_BOXES = {
  r1:{x:128,y:824, w:909,h:447},r2:{x:1103,y:824, w:893,h:447},
  r3:{x:128,y:1349,w:909,h:469},r4:{x:1103,y:1349,w:893,h:469},
  r5:{x:128,y:1880,w:909,h:487},r6:{x:1103,y:1880,w:893,h:487},
  r7:{x:128,y:2430,w:909,h:491},r8:{x:1103,y:2430,w:893,h:491},
};
const TOWER = {id:"tower",x:2108,y:768,w:674,h:1540}; // inside of the tower above the door, one wallpaper area

// Slots: the door and the three tower windows of the house picture; box = its place in house units
const SLOTS = [
  {id:"door",         type:"door",   x:2343, y:2472, w:176, h:396},
  {id:"tower-win-1",  type:"window", x:2360, y:900,  w:140, h:230},
  {id:"tower-win-2",  type:"window", x:2360, y:1420, w:140, h:230},
  {id:"tower-win-3",  type:"window", x:2360, y:1930, w:140, h:230},
];
const SLOT_NEAR = 40; // a drop this close to a slot box still snaps
const slotType=name=>/door/i.test(name)?"door":/window/i.test(name)?"window":/stair|spiral/i.test(name)?"stairs":null;

/* ---------------- owner mode (only while the URL has ?owner=shelest; never remembered) ---------------- */
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
lsSet("dollhouse-owner",null); // clean up the old remembered flag
const OWNER=new URLSearchParams(location.search).get("owner")==="shelest";
// the tray holds only the built-in item-*.webp stickers: drop every old saved upload / hidden-sticker list in this browser
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i); if(k&&/^dollhouse-(removed|uploads?|stickers?|pieces)/i.test(k))localStorage.removeItem(k)}}catch(e){}
try{indexedDB.deleteDatabase("dollhouse")}catch(e){}
let types=lsGet("dollhouse-types",{});                // src (built-in) -> "door" | "window" | "stairs"
for(const k in types) if(!/^layers\/item-/.test(k)) delete types[k]; lsSet("dollhouse-types",Object.keys(types).length?types:null); // old upload ids
const typeKey=it=>it.upload?it.id:it.src;
const typeOf=it=>types[typeKey(it)]||slotType(it.name);

/* ---------------- setup ---------------- */
const VB={x:0,y:0,w:3097,h:3040};          // the house layer box
const $=s=>document.querySelector(s);
const stage=$("#stage"), wrap=$("#wrap"), sheet=$("#sheet"), placedEl=$("#placed"), screens=$("#screens"), wallsEl=$("#walls");
const isWall=name=>/^wall/i.test(name);
const neverWall=it=>!it.upload||isItem(it.name); // built-in tray items (item-*.webp) are always objects, whatever their pixels look like
const isJpeg=(name,type)=>type==="image/jpeg"||/\.jpe?g$/i.test(name);
const builtins=STICKERS.map((s,i)=>({id:"s"+i, src:s.src, name:s.src.split("/").pop(), h:s.art?s.h:(s.h||80)*3*K, snap:s.snap||"auto", ratio:1, wall:false, ready:false}));
let items=[...builtins];
const videoRooms=new Set(); // rooms whose stickers are hidden while their finale videos play
const pos={};            // id -> {room, x, y}  (x = centre, y = bottom, canvas units, room = area or null, slot = slot id); wallpapers: {room}
let alive=false;

function drawHouse(){ // the picture is a scene layer; only the drop zones are drawn
  $("#zones").innerHTML=ROOMS.map(r=>`<rect class="zone" data-room="${r.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`).join("")+
    `<rect class="zone" data-room="tower" x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/>`;
}

/* ---------------- geometry helpers ---------------- */
const scale=()=>stage.getBoundingClientRect().width/VB.w;          // px per canvas unit
const PHONE=matchMedia("(max-width:700px)");
const LAND=matchMedia("(max-height:499px) and (orientation:landscape) and (max-width:999px)"); // phone held sideways (see the CSS)
let SY=1; // vertical stretch of the house on phones (1 … 2.2): one canvas unit is SY times taller than wide on screen
function measureStretch(){ const r=stage.getBoundingClientRect(); stage.style.setProperty("--k",r.width/VB.w);
  return PHONE.matches&&r.width?Math.min(2.2,Math.max(1,(r.height/VB.h)/(r.width/VB.w))):1 }
function toCanvas(cx,cy){const r=stage.getBoundingClientRect();return [VB.x+(cx-r.left)/r.width*VB.w, VB.y+(cy-r.top)/r.height*VB.h]}
function roomAt(x,y){
  const r=ROOMS.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h); if(r)return r;
  if(x>=TOWER.x&&x<=TOWER.x+TOWER.w&&y>=TOWER.y&&y<=TOWER.y+TOWER.h) return TOWER;
  return null;
}
const inRect=(cx,cy,el)=>{const r=el.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom};
function sizeOf(it,raw){ // height/width in canvas units, never bigger than a normal room; in a slot: contained in the slot box; × pos.s (editor size) unless raw
  // hy = the height in vertical canvas units (= h / SY on a stretched phone house, so the picture keeps its aspect)
  const sl=pos[it.id]?.slot&&SLOTS.find(s=>s.id===pos[it.id].slot);
  if(sl){const w=Math.min(sl.w,sl.h*SY*it.ratio); return {w,h:w/it.ratio,hy:w/it.ratio/SY}}
  const maxH=ROOMS[0].h*.92, maxW=ROOMS[0].w*.95;
  let h=Math.min(it.h,maxH), w=h*it.ratio; if(w>maxW){w=maxW;h=w/it.ratio}
  const s=raw?1:pos[it.id]?.s||1; h*=s; w*=s;
  return {w,h,hy:h/SY};
}
function slotAt(it,x,y){ // nearest slot of the item's type around the drop point, or null
  const t=typeOf(it); if(!t||it.wall)return null;
  const d=s=>Math.hypot(Math.max(s.x-x,0,x-s.x-s.w),Math.max(s.y-y,0,y-s.y-s.h));
  return SLOTS.filter(s=>s.type===t&&d(s)<=SLOT_NEAR).sort((a,b)=>d(a)-d(b))[0]||null;
}
function putSlot(it,sl){ // one picture per slot: the previous one goes back to the sheet
  items.forEach(o=>{if(o!==it&&pos[o.id]?.slot===sl.id)delete pos[o.id]});
  pos[it.id]={room:null,slot:sl.id}; slotPos(it,sl);
}
function slotPos(it,sl){ const {hy}=sizeOf(it); pos[it.id].x=sl.x+sl.w/2; pos[it.id].y=sl.type==="window"?sl.y+sl.h/2+hy/2:sl.y+sl.h }
function put(it,room,x,y){ // place a sticker (x,y = its centre); a wallpaper replaces the one already in that area
  if(it.wall){ items.forEach(o=>{if(o.wall&&o!==it&&pos[o.id]?.room===room.id)delete pos[o.id]}); pos[it.id]={room:room.id}; }
  else { const o=pos[it.id]; pos[it.id]={room:room?room.id:null,x,y:0,s:o?.s,z:o?.z}; pos[it.id].y=y+sizeOf(it).hy/2 } // keeps its editor size and order
}

/* ---------------- render ---------------- */
function fitSheet(){ // largest thumbnail height (max 22px phone / 28px desktop, min 14px) at which all stickers fit without scrolling
  sheet.style.setProperty("--tb",TRAY.toolbarScale);
  const land=LAND.matches, desk=innerWidth>860&&!land, max=Math.round((desk?28:land?20:22)*TRAY.toolbarScale), min=Math.min(desk||land?4:14,max);
  for(let t=max;t>=min;t--){ sheet.style.setProperty("--t",t+"px"); sheet.style.setProperty("--o",-Math.min(4,Math.round(t*.18))+"px");
    if(sheet.scrollHeight<=sheet.clientHeight+1&&(!(desk||land)||sheet.scrollWidth<=sheet.clientWidth+1)) break; } // desktop and phone sideways: one row across the full width
  document.documentElement.style.setProperty("--tbr",sheet.offsetHeight+"px");
}
function renderSheet(){
  // measure the sheet at the default sizes first: that height (--tbh) fixes the scene area, whatever the real tray sizes are
  const real=TRAY; TRAY={...DEFAULT_TRAY,trayItems:{}}; sheetHTML(); fitSheet();
  document.querySelector(".app").style.setProperty("--tbh",sheet.offsetHeight+"px");
  // phones (<=860px, outside the editor) keep the default tray: toolbarScale and tray item sizes apply on desktop only
  const phone=(innerWidth<=860||LAND.matches)&&!EDIT;
  if(!phone) TRAY=real;
  sheetHTML();
  bindSheet();
  fitSheet();
  TRAY=real;
}
function sheetHTML(){
  sheet.innerHTML=items.map(it=>
    `<button class="sticker${pos[it.id]?" used":""}${EDIT&&traySel&&trayKey(it)===traySel?" tsel":""}" type="button" data-id="${it.id}" aria-label="Sticker"><img src="${it.src}" alt="" draggable="false" style="height:calc(var(--t) * ${trayScaleOf(it).toFixed(3)});width:calc(var(--t) * ${(it.ratio*trayScaleOf(it)).toFixed(3)})">${OWNER?`<span class="types">${["door","window","stairs"].map(t=>`<span role="button" tabindex="0" data-type="${t}" class="${types[typeKey(it)]===t?"on":""}" title="${t}" aria-label="${t}">${t[0].toUpperCase()}</span>`).join("")}</span>`:""}</button>`).join("");
}
function bindSheet(){
  sheet.querySelectorAll(".sticker").forEach(el=>{el.addEventListener("pointerdown",startDrag);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();autoPlace(el.dataset.id)}})});
  sheet.querySelectorAll(".types span").forEach(b=>{const id=b.closest(".sticker").dataset.id;
    b.addEventListener("pointerdown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)});
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)}})});
}
function renderPlaced(popId){
  // wallpapers live in the house viewBox: image = room rect, clipped by the room rect
  SY=measureStretch();
  // on a stretched phone house the image is drawn SY times taller and squeezed back by the stretch, so it is not distorted
  wallsEl.innerHTML=`<defs>${ROOMS.map(r=>`<clipPath id="clip-${r.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/></clipPath>`).join("")}
    <clipPath id="clip-tower"><rect x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/></clipPath></defs>`+
    items.filter(it=>it.wall&&pos[it.id]).map(it=>{const id=pos[it.id].room,b=ROOMS.find(r=>r.id===id)||TOWER;
    const cls=(popId===it.id?"pop":"")+(videoRooms.has(id)?" gone":"");
    const img=`<image href="${it.src}" data-id="${it.id}" class="${cls}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"
      preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-${id})"/>`;

      op={type:"pinch",d0,z0:zoom}; return }
    if(pts.size>2)return;
    if(space||e.altKey||e.button===1){ op={type:"pan",x:e.clientX,y:e.clientY,px:panX,py:panY}; return }
    const [x,y]=toArt(e.clientX,e.clientY), h=e.target.dataset&&e.target.dataset.h;
    const orig=()=>Object.fromEntries(opNames().map(n=>[n,{...box(n)}]));
    if(h&&sel.size){ const b=selBox(), c=[b.x+(h.includes("e")?b.w:0),b.y+(h.includes("s")?b.h:0)], a=[b.x+(h.includes("e")?0:b.w),b.y+(h.includes("s")?0:b.h)];
      op={type:"size",a,c,x,y,o:orig()}; fade(true); return }
    const dh=hitDrop(x,y); // dropped stickers are in front of every layer
    const inSel=!e.shiftKey&&(dh?sel.has(dh):[...sel].some(n=>{const l=box(n); if(n===HG)return x>=l.x&&y>=l.y&&x<=l.x+l.w&&y<=l.y+l.h; return !edHidden(n)&&x>=l.x&&y>=l.y&&x<=l.x+l.w&&y<=l.y+l.h&&alphaAt(n,(x-l.x)/l.w,(y-l.y)/l.h)>16}));
    if(inSel){ op={type:"move",x,y,o:orig()}; fade(true); if(liftOn)lift=new Set(sel); applyLayers(); return }
    const hit=dh||hitTest(x,y);
    if(!hit){ if(!e.shiftKey)sel.clear(); drawSel(); op=null; return }
    if(e.shiftKey){ sel.has(hit)?sel.delete(hit):sel.add(hit) } else if(!sel.has(hit)) sel=new Set([hit]);
    drawSel(); op=sel.size?{type:"move",x,y,o:orig()}:null; fade(!!op); if(op&&liftOn){lift=new Set(sel); applyLayers()}
    $("#estatus").textContent=[...sel].join(", ");
  },true);
  wrap.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return; pts.set(e.pointerId,[e.clientX,e.clientY]); if(!op)return;
    if(op.type==="pinch"){ if(pts.size<2)return; const [a,b]=[...pts.values()]; setZoom(op.z0*Math.hypot(a[0]-b[0],a[1]-b[1])/op.d0,(a[0]+b[0])/2,(a[1]+b[1])/2); return }
    if(op.type==="pinchSel"){ if(pts.size<2)return; const [a,b]=[...pts.values()]; scaleSel(Math.hypot(a[0]-b[0],a[1]-b[1])/op.d0,op.o); applyLayers(); return }
    if(op.type==="pan"){ panX=op.px+e.clientX-op.x; panY=op.py+e.clientY-op.y; applyView(); return }
    const [x,y]=toArt(e.clientX,e.clientY);
    if(op.type==="move"){ for(const n in op.o){const q=op.o[n]; setBox(n,{...q,x:q.x+x-op.x,y:q.y+y-op.y})} }
    else { // relative to where the handle was grabbed (it may be drawn inside the window rather than at the real corner)
      const {a,c}=op, vx=c[0]-a[0], vy=c[1]-a[1], pr=(px,py)=>(px-a[0])*vx+(py-a[1])*vy, s=Math.max(.05,pr(x,y)/(pr(op.x,op.y)||1));
      // shift = free resize (width and height separately); the house group always keeps its aspect
      const free=e.shiftKey&&!sel.has(HG), sx=free?Math.max(.05,(x-a[0])/((op.x-a[0])||1)):s, sy=free?Math.max(.05,(y-a[1])/((op.y-a[1])||1)):s;
      for(const n in op.o){const q=op.o[n]; setBox(n,{x:a[0]+(q.x-a[0])*sx,y:a[1]+(q.y-a[1])*sy,w:q.w*sx,h:q.h*sy})} }
    applyLayers();
  },true);
  const up=e=>{ if(!pts.delete(e.pointerId))return; if(op&&op.type!=="pinch"||!pts.size){ if(op&&op.type!=="pan"&&op.type!=="pinch"){saveDraft(); useLayers(LAYERS)} op=null; fade(false); if(lift.size){lift.clear(); applyLayers()} } };
  wrap.addEventListener("pointerup",up,true); wrap.addEventListener("pointercancel",up,true);
  wrap.addEventListener("click",e=>e.stopPropagation(),true);
  // wheel / trackpad pinch (ctrl+wheel) / Safari gesture zoom, about the pointer
  // alt / cmd + wheel over the selection sizes it instead
  wrap.addEventListener("wheel",e=>{e.preventDefault();
    if((e.altKey||e.metaKey)&&!e.ctrlKey&&sel.size){ const [x,y]=toArt(e.clientX,e.clientY), b=selBox();
      if(x>=b.x&&y>=b.y&&x<=b.x+b.w&&y<=b.y+b.h){ scaleSel(Math.exp(-(e.deltaY||e.deltaX)*.0015)); applyLayers(); commitSoon(); return } }
    setZoom(zoom*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY)},{passive:false});
  let g0=1; wrap.addEventListener("gesturestart",e=>{e.preventDefault(); g0=zoom});
  wrap.addEventListener("gesturechange",e=>{e.preventDefault(); setZoom(g0*e.scale,e.clientX,e.clientY)});
  wrap.style.touchAction="none";
}

drawHouse(); builtins.forEach(measure); render();
checkLoaded();
</script>
<script>/* song player (see .song): autoplays once the loading screen is gone; if the browser blocks that, the first tap / key anywhere starts it,
   unless she paused it with the player button first. Pauses while the tab is hidden and resumes afterwards if it was playing. */
(function(){ const $=id=>document.getElementById(id), el=$("song"), a=$("songAudio"), btn=$("songBtn"), bar=$("songBar"), fill=$("songFill"), knob=$("songKnob");
  let userPaused=false, hiddenPaused=false, armed=false;
  const GESTURES=["pointerdown","touchstart","keydown","pointerup","touchend"]; // the last two: Chrome on Android only counts a touch on release
  const disarm=()=>{ if(!armed)return; armed=false; GESTURES.forEach(t=>removeEventListener(t,onGesture,true)) };
  const arm=()=>{ if(armed)return; armed=true; GESTURES.forEach(t=>addEventListener(t,onGesture,true)) };
  function onGesture(e){ if(userPaused||!a.paused){ disarm(); return }
    if(btn.contains(e.target)){ disarm(); return } // the play button starts it itself
    tryPlay("gesture "+e.type) }
  function tryPlay(why){ console.log("[song] play() attempt: "+why);
    a.play().then(()=>{ console.log("[song] playing"); disarm() },err=>{ console.log("[song] play() blocked: "+err.name); if(err.name==="NotAllowedError"&&!userPaused) arm() }) }
  ["pointerdown","click","touchstart"].forEach(t=>el.addEventListener(t,e=>e.stopPropagation()));
  btn.addEventListener("click",()=>{ if(a.paused){ userPaused=false; a.play().catch(()=>{}) } else{ userPaused=true; disarm(); a.pause() } });
  $("songPrev").addEventListener("click",()=>{ a.currentTime=0; draw() });
  $("songMin").addEventListener("click",e=>{ e.stopPropagation(); el.classList.add("min") });
  $("songTb").addEventListener("click",()=>el.classList.remove("min"));
  const sync=()=>{ el.classList.toggle("playing",!a.paused); btn.setAttribute("aria-label",a.paused?"Play song":"Pause song") };
  a.addEventListener("play",sync); a.addEventListener("pause",sync);
  const fmt=t=>{ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0") };
  let dragging=false;
  function draw(f){ const d=a.duration||0, t=f==null?a.currentTime:f*d, p=d?t/d*100:0;
    fill.style.width=p+"%"; knob.style.left=p+"%"; $("songEl").textContent=fmt(t); $("songRem").textContent="-"+fmt(d-t) }
  ["timeupdate","loadedmetadata","durationchange","seeked"].forEach(t=>a.addEventListener(t,()=>{ if(!dragging) draw() }));
  const frac=e=>{ const r=bar.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)) };
  const seek=f=>{ const go=()=>{ a.currentTime=f*a.duration; draw() }; if(a.duration) go(); else a.addEventListener("loadedmetadata",go,{once:true}) };
  bar.addEventListener("pointerdown",e=>{ dragging=true; bar.setPointerCapture(e.pointerId); draw(frac(e)) });
  bar.addEventListener("pointermove",e=>{ if(dragging) draw(frac(e)) });
  bar.addEventListener("pointerup",e=>{ if(!dragging)return; dragging=false; seek(frac(e)) });
  bar.addEventListener("pointercancel",()=>{ dragging=false; draw() });
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ if(!a.paused){ hiddenPaused=true; a.pause() } }
    else{ if(hiddenPaused&&!userPaused) a.play().catch(()=>{}); hiddenPaused=false } });
  /* called by hideLoader when everything is decoded: play() while the loader is still up; if autoplay is blocked, show "tap to enter ♡"
     and start the song inside that first tap, then reveal. After one tap this session the prompt is skipped (the tap-anywhere fallback stays). */
  window.songGate=reveal=>{ let done=false; const go=()=>{ if(!done){ done=true; reveal() } };
    const ask=()=>{ if(done)return; let tapped=false; try{ tapped=sessionStorage.getItem("dollhouse-tapped")==="1" }catch(e){}
      if(tapped){ go(); return }
      const l=$("loader"); l.classList.add("ask"); const T=["pointerdown","touchstart","keydown"];
      const tap=e=>{ T.forEach(t=>removeEventListener(t,tap,true)); e.stopPropagation(); try{ sessionStorage.setItem("dollhouse-tapped","1") }catch(e){}
        console.log("[song] play() attempt: enter tap"); a.play().then(()=>console.log("[song] playing"),err=>console.log("[song] play() blocked: "+err.name));
        if(e.type!=="keydown"){ const eat=ev=>{ ev.stopPropagation(); ev.preventDefault() }; addEventListener("click",eat,true); setTimeout(()=>removeEventListener("click",eat,true),600) }
        go() };
      T.forEach(t=>addEventListener(t,tap,true)) };
    console.log("[song] play() attempt: ready");
    a.play().then(()=>{ console.log("[song] playing"); go() },err=>{ console.log("[song] play() blocked: "+err.name); clearTimeout(wait); ask() });
    const wait=setTimeout(go,4000) }; // allowed but still buffering: reveal anyway, it starts when it can
  const show=()=>{ const l=$("loader"); if(!l||l.classList.contains("out")){ el.classList.add("on"); draw(); tryPlay("reveal") } else setTimeout(show,200) }; show();
})();</script>
