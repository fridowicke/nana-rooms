<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dollhouse Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: tall pointed house on the left, sticker sheet on the right (stacks on phones). Black on white, square corners, dashed cut-lines. */
:root{
  --bg:#ffffff; --ink:#000000; --dim:rgba(0,0,0,.35); --faint:rgba(0,0,0,.05); --muted:#666666;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;-webkit-user-select:none;user-select:none}
*{border-radius:0}
.app{margin:0 auto;display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.how{margin:0;max-width:70ch;line-height:1.5}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#progress{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--bg);border:1px solid var(--ink);padding:6px 12px}
.btn:hover,.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* house */
.stageWrap{position:relative;width:100%;justify-self:center}
.stage{position:relative;width:100%;aspect-ratio:800/1200}
.layer{position:absolute;inset:0;width:100%;height:100%}
.screens{position:absolute;inset:0;pointer-events:none}
.screens video{position:absolute;object-fit:cover;opacity:0;transition:opacity .7s ease;background:var(--ink)}
.screens video.on{opacity:1}
.struct{fill:none;stroke:var(--dim);stroke-width:3;stroke-dasharray:12 9;transition:stroke .4s}
.alive .struct{stroke:var(--ink);stroke-dasharray:none}
.struct .fine{stroke-width:2;stroke-dasharray:5 4}
.alive .struct .fine{stroke-dasharray:none}
.zone{fill:transparent;stroke:none;transition:fill .15s}
.zone.hot{fill:var(--faint)}
.walls{position:absolute;inset:0;pointer-events:none}
.walls img{position:absolute;object-fit:cover;pointer-events:auto;touch-action:none;cursor:grab;-webkit-user-drag:none}
.walls img.lift{opacity:.25}
.walls img.pop{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alive .walls img{cursor:default}
.placed{position:absolute;inset:0;pointer-events:none}
.placed img{pointer-events:auto;position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;-webkit-user-drag:none;transition:left .25s ease,top .25s ease}
.placed img.lift{opacity:.25;transition:none}
.placed img.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.9)}to{opacity:1;transform:translate(-50%,-100%)}}
.alive .placed img{cursor:default}
.banner{position:absolute;left:50%;top:24%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
.alive .banner{opacity:1;pointer-events:auto}

/* sticker sheet */
.sheet{border:1px dashed var(--dim);padding:16px;min-height:320px;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-start;gap:14px;transition:opacity .3s}
.sheet.locked{opacity:.3;pointer-events:none}
.sticker{position:relative;border:1px dashed var(--dim);padding:6px;display:grid;place-items:end center;background:transparent;touch-action:none;cursor:grab;min-width:0}
.sticker:hover{border-color:var(--ink)}
.sticker img{display:block;pointer-events:none;-webkit-user-drag:none;max-width:100%}
.sticker.used img{visibility:hidden}
.sticker.used{cursor:default}
.add{border:1px dashed var(--dim);color:var(--muted);font-size:22px;width:72px;height:72px;display:grid;place-items:center;position:relative;cursor:pointer}
.add:hover{border-color:var(--ink);color:var(--ink)}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.emptyNote{color:var(--muted);margin:0;align-self:center;flex:1 1 200px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
.ghost.back{transition:all .25s ease-in}

@media (max-width:860px){ .app{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="how">Drag the stickers into the house. Drop one low in a room and it stands on the floor; drop it high and it stays on the wall. Drag a sticker out of the house to take it back. Use every sticker and the house comes alive.</p>
    <div class="hud">
      <span id="progress"></span>
      <button class="btn" id="random" type="button">Random</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
  </header>

  <div class="stageWrap" id="wrap">
    <div class="stage" id="stage">
      <svg class="layer" id="zones" viewBox="0 -20 800 1200" aria-hidden="true"></svg>
      <div class="walls" id="walls"></div>
      <div class="screens" id="screens"></div>
      <svg class="layer" id="lines" viewBox="0 -20 800 1200" aria-hidden="true" style="pointer-events:none"></svg>
      <div class="placed" id="placed" aria-label="House"></div>
      <div class="banner"><button class="btn primary" id="again" type="button">Play again</button></div>
    </div>
  </div>

  <div class="sheet" id="sheet" aria-label="Stickers"></div>
</div>

<script>
/* =====================================================================
   SETTINGS
   ---------------------------------------------------------------------
   STICKERS: put your PNG files into  pieces/  and list them here:
     {src:"pieces/bed.png",   h:80}               h = height in the house, shown 3× bigger
     {src:"pieces/lamp.png",  h:50, snap:"free"}   (one room is 162 tall; never bigger than the room)
     {src:"pieces/sofa.png",  h:70, snap:"floor"}
   WALLPAPER: name a file wall_something.png (any name starting with "wall") to make it a wallpaper.
     Dropped on a room or the attic it covers that whole area behind the furniture; one per area,
     a new one sends the old one back to the sheet. This works for uploaded files too.
   snap: "auto"  (default) low drop → stands on the floor, high drop → stays on the wall
         "floor" always stands on the floor
         "free"  always stays where it was dropped
   ALLOW_UPLOAD: true shows a "+" on the sheet to test PNGs from your computer
                 (you can also drop files onto the sheet). Set false for the public site.
   ===================================================================== */
const STICKERS = [
  // {src:"pieces/bed.png", h:80},
  {src:"pieces/door.png", h:50, snap:"floor"},
];
const ALLOW_UPLOAD = true;
const UPLOAD_HEIGHT = 240;

const VIDEOS = []; // videos off for now; files stay in videos/ (v01.mp4 … v10.mp4)

// House geometry (800 × 1200 canvas). 4 floors × 2 rooms, floors 162 high; left rooms 16:9 (288 × 162),
// right rooms 16:9 on floors 1 and 4, 14:9 (252 × 162) on floors 2–3 with a ladder strip on their left. + attic.
const ROOMS = [
  {id:"r1",x:100,y:512, w:288,h:162},{id:"r2",x:388,y:512, w:288,h:162},
  {id:"r3",x:100,y:674, w:288,h:162},{id:"r4",x:424,y:674, w:252,h:162},
  {id:"r5",x:100,y:836, w:288,h:162},{id:"r6",x:424,y:836, w:252,h:162},
  {id:"r7",x:100,y:998, w:288,h:162},{id:"r8",x:388,y:998, w:288,h:162},
];
const ATTIC = {id:"attic", poly:[[100,512],[230,300],[546,300],[676,512]], top:300, floor:512, video:false};

/* ---------------- setup ---------------- */
const VB={x:0,y:-20,w:800,h:1200};
const $=s=>document.querySelector(s);
const stage=$("#stage"), wrap=$("#wrap"), sheet=$("#sheet"), placedEl=$("#placed"), screens=$("#screens"), wallsEl=$("#walls");
const isWall=name=>/^wall/i.test(name);
let items=STICKERS.map((s,i)=>({id:"s"+i, src:s.src, h:(s.h||80)*3, snap:s.snap||"auto", ratio:1, wall:isWall(s.src.split("/").pop())}));
const pos={};            // id -> {room, x, y}  (x = centre, y = bottom, canvas units); wallpapers: {room}
const AX=ATTIC.poly.map(p=>p[0]), AY=ATTIC.poly.map(p=>p[1]);
const ATTIC_BOX={x:Math.min(...AX),y:Math.min(...AY),w:Math.max(...AX)-Math.min(...AX),h:Math.max(...AY)-Math.min(...AY)};
ATTIC_BOX.clip=`polygon(${ATTIC.poly.map(([x,y])=>`${(x-ATTIC_BOX.x)/ATTIC_BOX.w*100}% ${(y-ATTIC_BOX.y)/ATTIC_BOX.h*100}%`).join(",")})`;
let alive=false, lastClips=[];

function drawHouse(){
  const pts=ATTIC.poly.map(p=>p.join(",")).join(" ");
  const win=(x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="${w}"/><path d="M${x+w/2} ${y}V${y+w}M${x} ${y+w/2}H${x+w}"/>`;
  let fine="";
  // two attic windows, three chimneys
  fine+=win(258,380,44)+win(474,380,44);
  [262,370,478].forEach(x=>fine+=`<path d="M${x} 300V262H${x+26}V300"/>`);
  // half-circle stairs on the left wall, one per floor
  for(let f=0;f<4;f++){const t=512+f*162,c=t+81;
    fine+=`<path d="M100 ${t}A81 81 0 0 0 100 ${t+162}M100 ${c-40}A40 40 0 0 0 100 ${c+40}"/>`;
    for(let k=1;k<6;k++){const a=Math.PI/2+k*Math.PI/6,cs=Math.cos(a),sn=Math.sin(a);
      fine+=`<path d="M${(100+40*cs).toFixed(1)} ${(c-40*sn).toFixed(1)}L${(100+81*cs).toFixed(1)} ${(c-81*sn).toFixed(1)}"/>`;}
  }
  // ladder between the columns, floors 2–3
  fine+=`<path d="M398 678V998M414 678V998`;
  for(let y=694;y<998;y+=20) fine+=`M398 ${y}H414`;
  fine+=`"/>`;
  // tower: window, three hatched flights going down, arched door
  fine+=win(696,526,30);
  [[640,1],[792,-1],[944,1]].forEach(([y,d])=>{const x0=d>0?686:736,x1=d>0?736:686;
    fine+=`<path d="M${x0} ${y}L${x1} ${y+110}M${x0} ${y+22}L${x1} ${y+132}`;
    for(let k=1;k<7;k++){const x=x0+(x1-x0)*k/7,yy=y+110*k/7; fine+=`M${x} ${yy}V${yy+22}`}
    fine+=`"/>`;});
  fine+=`<path d="M696 1160V1110A15 15 0 0 1 726 1110V1160"/>`;
  // mailbox on a post
  fine+=`<path d="M770 1160V1092M752 1092V1074A19 12 0 0 1 790 1074V1092ZM786 1074V1056H776V1064H786"/>`;
  $("#lines").innerHTML=`<g class="struct">
    <polygon points="${pts}"/>
    <rect x="100" y="512" width="576" height="648"/>
    <path d="M100 674H676M100 836H676M100 998H676M388 512V1160M424 674V998"/>
    <path d="M676 512L711 420L746 512V1160"/>
    <path d="M10 1160H790"/>
    <g class="fine">${fine}</g></g>`;
  $("#zones").innerHTML=ROOMS.map(r=>`<rect class="zone" data-room="${r.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`).join("")+
    `<polygon class="zone" data-room="attic" points="${pts}"/>`;
}

/* ---------------- geometry helpers ---------------- */
const scale=()=>stage.getBoundingClientRect().width/VB.w;          // px per canvas unit
function toCanvas(cx,cy){const r=stage.getBoundingClientRect();return [VB.x+(cx-r.left)/r.width*VB.w, VB.y+(cy-r.top)/r.height*VB.h]}
function inPoly(px,py,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c}return c}
function roomAt(x,y){
  const r=ROOMS.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h); if(r)return r;
  if(inPoly(x,y,ATTIC.poly)) return {id:"attic",attic:true};
  return null;
}
function sizeOf(it,room){ // height/width in canvas units, kept inside the room
  const maxH=room&&!room.attic?room.h*.92:(ATTIC.floor-ATTIC.top)*.85, maxW=room&&!room.attic?room.w*.95:400;
  let h=Math.min(it.h,maxH), w=h*it.ratio; if(w>maxW){w=maxW;h=w/it.ratio}
  return {w,h};
}
function placement(it,room,x,y){ // where a sticker lands for a drop at (x,y)
  const {w,h}=sizeOf(it,room);
  if(room.attic){const fy=ATTIC.floor; const half=(fy-ATTIC.top); const [[l],,,[r]]=ATTIC.poly, mid=(l+r)/2;
    const spread=(r-l)/2*0.8; const cx=Math.max(mid-spread+w/2,Math.min(mid+spread-w/2,x));
    const floor = it.snap==="free"||(it.snap==="auto"&&y<fy-half*.45);
    return {room:"attic",x:cx,y:floor?Math.min(fy,Math.max(y+h/2,ATTIC.top+half*.3+h)):fy};}
  const cx=Math.max(room.x+w/2+4,Math.min(room.x+room.w-w/2-4,x));
  const toFloor=it.snap==="floor"||(it.snap==="auto"&&y>room.y+room.h*.45);
  const by=toFloor?room.y+room.h-2:Math.max(room.y+h+4,Math.min(room.y+room.h-2,y+h/2));
  return {room:room.id,x:cx,y:by};
}
function put(it,room,x,y){ // place a sticker; a wallpaper replaces the one already in that area
  if(it.wall){ items.forEach(o=>{if(o.wall&&o!==it&&pos[o.id]?.room===room.id)delete pos[o.id]}); pos[it.id]={room:room.id}; }
  else pos[it.id]=placement(it,room,x,y);
}

/* ---------------- render ---------------- */
const thumbH=it=>Math.min(160,Math.max(72,sizeOf(it,null).h*scale())); // sticker size on the sheet, px
function renderSheet(){
  sheet.innerHTML=items.map(it=>
    `<button class="sticker${pos[it.id]?" used":""}" type="button" data-id="${it.id}" aria-label="Sticker"><img src="${it.src}" alt="" draggable="false" style="height:${thumbH(it)}px"></button>`).join("")+
    (items.length?"":`<p class="emptyNote">No stickers yet. Add PNG files in the settings${ALLOW_UPLOAD?" or press + to try some from your computer":""}.</p>`)+
    (ALLOW_UPLOAD?`<label class="add" title="Add PNG">+<input type="file" id="upload" accept="image/png,image/webp,image/gif,image/svg+xml" multiple aria-label="Add PNG stickers"></label>`:"");
  sheet.querySelectorAll(".sticker").forEach(el=>{el.addEventListener("pointerdown",startDrag);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();autoPlace(el.dataset.id)}})});
  const up=$("#upload"); if(up) up.addEventListener("change",()=>{addFiles(up.files);up.value=""});
}
function renderPlaced(popId){
  wallsEl.innerHTML=items.filter(it=>it.wall&&pos[it.id]).map(it=>{const b=ROOMS.find(r=>r.id===pos[it.id].room)||ATTIC_BOX;
    return `<img src="${it.src}" alt="" draggable="false" data-id="${it.id}" class="${popId===it.id?"pop":""}"
      style="left:${(b.x-VB.x)/VB.w*100}%;top:${(b.y-VB.y)/VB.h*100}%;width:${b.w/VB.w*100}%;height:${b.h/VB.h*100}%;${b.clip?`clip-path:${b.clip}`:""}">`}).join("");
  wallsEl.querySelectorAll("img").forEach(el=>el.addEventListener("pointerdown",startDrag));
  placedEl.innerHTML=items.filter(it=>!it.wall&&pos[it.id]).map(it=>{const p=pos[it.id],room=ROOMS.find(r=>r.id===p.room)||{attic:true},{h}=sizeOf(it,room);
    return `<img src="${it.src}" alt="" draggable="false" data-id="${it.id}" class="${popId===it.id?"pop":""}"
      style="left:${(p.x-VB.x)/VB.w*100}%;top:${(p.y-VB.y)/VB.h*100}%;height:${h/VB.h*100}%">`}).join("");
  placedEl.querySelectorAll("img").forEach(el=>el.addEventListener("pointerdown",startDrag));
  updateHud();
}
function render(popId){renderSheet();renderPlaced(popId)}
function placedCount(){return items.filter(it=>pos[it.id]).length}
function allPlaced(){return items.length>0&&placedCount()===items.length}
function updateHud(){ $("#progress").textContent=`${placedCount()} / ${items.length} placed`; $("#random").disabled=!items.some(it=>!pos[it.id]); }

/* ---------------- drag ---------------- */
let drag=null;
function startDrag(e){
  if(alive)return; const el=e.currentTarget, it=items.find(i=>i.id===el.dataset.id); if(!it)return;
  if(el.classList.contains("sticker")&&pos[it.id])return;
  el.setPointerCapture(e.pointerId);
  const gh=new Image(); gh.src=it.src; gh.className="ghost"; gh.style.height=thumbH(it)+"px"; document.body.appendChild(gh);
  drag={el,it,gh,x0:e.clientX,y0:e.clientY,moved:false,fromHouse:!!pos[it.id]};
  moveGhost(e.clientX,e.clientY);
  el.onpointermove=ev=>{ if(!drag.moved&&Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)>6){drag.moved=true; if(drag.fromHouse)el.classList.add("lift")}
    moveGhost(ev.clientX,ev.clientY); const [x,y]=toCanvas(ev.clientX,ev.clientY); hot(roomAt(x,y)) };
  el.onpointerup=ev=>endDrag(ev); el.onpointercancel=()=>endDrag(null);
}
function moveGhost(x,y){drag.gh.style.left=x+"px";drag.gh.style.top=y+"px"}
function hot(room){document.querySelectorAll(".zone").forEach(z=>z.classList.toggle("hot",!!room&&z.dataset.room===room.id))}
function endDrag(ev){
  const d=drag; drag=null; d.el.onpointermove=d.el.onpointerup=d.el.onpointercancel=null; hot(null);
  if(ev&&!d.moved){ d.gh.remove(); if(d.fromHouse){delete pos[d.it.id];render()} else autoPlace(d.it.id); return }
  const [x,y]=ev?toCanvas(ev.clientX,ev.clientY):[-1,-1], room=ev&&roomAt(x,y);
  if(room){ d.gh.remove(); put(d.it,room,x,y); render(d.it.id); checkDone(); return }
  // dropped outside the house → back to the sheet
  delete pos[d.it.id]; render();
  const home=sheet.querySelector(`[data-id="${d.it.id}"]`)?.getBoundingClientRect();
  if(home){ d.gh.classList.add("back"); Object.assign(d.gh.style,{left:home.left+home.width/2+"px",top:home.top+home.height/2+"px",opacity:"0"}); setTimeout(()=>d.gh.remove(),260) } else d.gh.remove();
}
function autoPlace(id){ if(alive)return; const it=items.find(i=>i.id===id); if(!it||pos[id])return;
  const rooms=it.wall?ROOMS.filter(r=>!items.some(o=>o.wall&&pos[o.id]?.room===r.id)):ROOMS; if(!rooms.length)return;
  const counts=rooms.map(r=>items.filter(i=>pos[i.id]?.room===r.id).length), min=Math.min(...counts);
  const choices=rooms.filter((r,i)=>counts[i]===min), room=choices[Math.floor(Math.random()*choices.length)];
  put(it,room,room.x+room.w*(.25+Math.random()*.5),room.y+room.h*(it.snap==="free"?.3:.9));
  render(id); checkDone();
}

/* ---------------- test uploads ---------------- */
function addFiles(files){
  [...files].filter(f=>/^image\//.test(f.type)).forEach(f=>{
    const src=URL.createObjectURL(f), it={id:"u"+Math.random().toString(36).slice(2,8),src,h:UPLOAD_HEIGHT,snap:"auto",ratio:1,wall:isWall(f.name)};
    items.push(it); measure(it);
  }); render();
}
if(ALLOW_UPLOAD){
  sheet.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("Files"))e.preventDefault()});
  sheet.addEventListener("drop",e=>{if(!e.dataTransfer.files.length)return;e.preventDefault();addFiles(e.dataTransfer.files)});
}
function measure(it){const im=new Image(); im.onload=()=>{it.ratio=im.naturalWidth/im.naturalHeight||1; render()}; im.src=it.src}

/* ---------------- the house comes alive ---------------- */
function checkDone(){ if(allPlaced()) setTimeout(wake,500) }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickClips(n){
  let pick,t=0; do{ pick=shuffle(VIDEOS.slice()).slice(0,n); t++ }while(t<30&&pick.join()===lastClips.join());
  while(pick.length<n) pick.push(VIDEOS[Math.floor(Math.random()*VIDEOS.length)]);
  lastClips=pick; return pick;
}
function wake(){
  if(alive||!allPlaced())return; alive=true; sheet.classList.add("locked");
  screens.innerHTML="";
  if(VIDEOS.length){ const clips=pickClips(ROOMS.length);
  shuffle(ROOMS.map((_,i)=>i)).forEach((ri,k)=>{const r=ROOMS[ri],v=document.createElement("video");
    Object.assign(v,{src:clips[ri],muted:true,loop:true,playsInline:true,autoplay:true}); v.setAttribute("playsinline","");
    Object.assign(v.style,{left:(r.x-VB.x)/VB.w*100+"%",top:(r.y-VB.y)/VB.h*100+"%",width:r.w/VB.w*100+"%",height:r.h/VB.h*100+"%"});
    screens.appendChild(v); v.play().catch(()=>{}); setTimeout(()=>v.classList.add("on"),200+k*260);
  }); }
  wrap.classList.add("alive");
}
function reset(){
  screens.querySelectorAll("video").forEach(v=>v.classList.remove("on")); wrap.classList.remove("alive");
  stage.querySelectorAll(".placed img,.walls img").forEach(i=>i.style.opacity="0");
  setTimeout(()=>{for(const k in pos)delete pos[k]; screens.innerHTML=""; alive=false; sheet.classList.remove("locked"); render()},350);
}
$("#again").addEventListener("click",reset);
$("#reset").addEventListener("click",reset);
$("#random").addEventListener("click",()=>{ if(alive)return; items.filter(it=>!pos[it.id]).forEach((it,i)=>setTimeout(()=>autoPlace(it.id),i*60)) });
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderSheet,120)});

drawHouse(); items.forEach(measure); render();
</script>
</body>
</html>
