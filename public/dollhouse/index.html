<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dollhouse Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: tall pointed house on the left, sticker sheet on the right (stacks on phones). Black on white, square corners, dashed cut-lines. */
:root{
  --bg:#ffffff; --ink:#000000; --dim:rgba(0,0,0,.35); --faint:rgba(0,0,0,.05); --muted:#666666;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;-webkit-user-select:none;user-select:none}
*{border-radius:0}
.app{margin:0 auto;display:grid;grid-template-columns:1fr;gap:8px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.how{margin:0;max-width:70ch;font-size:12px;line-height:1.3;color:var(--muted)}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;line-height:1.3}
#progress{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--bg);border:1px solid var(--ink);padding:3px 8px;font-size:12px;line-height:1.3}
.btn:hover,.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* house */
.stageWrap{position:relative;width:100%;justify-self:center}
.stage{position:relative;width:min(100%,calc((100vh - 60px) * 1090 / 920));width:min(100%,calc((100dvh - 60px) * 1090 / 920));margin:0 auto;aspect-ratio:1090/920}
.layer{position:absolute;inset:0;width:100%;height:100%}
.screens{position:absolute;inset:0;pointer-events:none}
.screens video{position:absolute;object-fit:cover;opacity:0;transition:opacity .7s ease;background:var(--ink)}
.screens video.on{opacity:1}
.struct{fill:none;stroke:var(--dim);stroke-width:3;stroke-dasharray:12 9;transition:stroke .4s}
.alive .struct{stroke:var(--ink);stroke-dasharray:none}
.struct .fine{stroke-width:2;stroke-dasharray:5 4}
.alive .struct .fine{stroke-dasharray:none}
.struct .fine .rung{stroke-width:4;stroke-dasharray:none}
.zone{fill:transparent;stroke:none;transition:fill .15s}
.zone.hot{fill:var(--faint)}
.walls{position:absolute;inset:0;pointer-events:none}
.walls image{pointer-events:auto;touch-action:none;cursor:grab}
.walls image.lift{opacity:.25}
.walls image.pop{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alive .walls image{cursor:default}
.placed{position:absolute;inset:0;pointer-events:none}
#lines .filled{display:none}
.placed img{pointer-events:auto;position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;-webkit-user-drag:none;transition:left .25s ease,top .25s ease}
.placed img.lift{opacity:.25;transition:none}
.placed img.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.9)}to{opacity:1;transform:translate(-50%,-100%)}}
.alive .placed img{cursor:default}
.banner{position:absolute;left:50%;top:24%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
.alive .banner{opacity:1;pointer-events:auto}

/* sticker sheet */
.sheet{padding:6px;min-height:68px;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-start;gap:6px;transition:opacity .3s}
.sheet.locked{opacity:.3;pointer-events:none}
.sticker{position:relative;border:0;padding:0;display:grid;place-items:end center;background:transparent;touch-action:none;cursor:grab;min-width:0;transition:opacity .15s,transform .15s}
.sticker:hover{opacity:.75;transform:scale(1.04)}
.sticker:active{transform:scale(.97)}
.sticker img{display:block;pointer-events:none;-webkit-user-drag:none;max-width:100%}
.sticker.used{display:none}
.del{position:absolute;top:-9px;right:-9px;width:28px;height:28px;display:grid;place-items:center;background:none;border:0;color:var(--ink);font-size:13px;line-height:1;cursor:pointer;touch-action:none;z-index:1}
.del::before{content:"";position:absolute;inset:5px;background:var(--bg,#fff);border:1px solid var(--dim);z-index:-1}
.del:hover::before{border-color:var(--ink)}
.add{border:0;color:var(--muted);font-size:22px;width:56px;height:56px;display:grid;place-items:center;position:relative;cursor:pointer;transition:opacity .15s,transform .15s}
.add:hover{color:var(--ink);transform:scale(1.04)}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.types{display:flex;gap:2px;margin-top:3px}
.types span{font-size:9px;line-height:1;padding:2px 3px;border:1px solid var(--dim);color:var(--muted);background:var(--bg);cursor:pointer;touch-action:none}
.types span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ownerLine{flex:1 1 100%;margin:4px 0 0;font-size:11px;color:var(--muted)}
.ownerLine a{color:inherit;cursor:pointer;text-decoration:underline}
.emptyNote{color:var(--muted);margin:0;align-self:center;flex:1 1 200px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
.ghost.back{transition:all .25s ease-in}

@media (max-width:860px){ header{flex-wrap:wrap;row-gap:4px} .app{grid-template-columns:minmax(0,1fr)} .stage{width:100%} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="how">Drag stickers into the house. Use every sticker and it comes alive.</p>
    <div class="hud">
      <span id="progress"></span>
      <button class="btn" id="random" type="button">Random</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
  </header>

  <div class="stageWrap" id="wrap">
    <div class="stage" id="stage">
      <svg class="layer" id="zones" viewBox="-80 250 1090 920" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg class="layer walls" id="walls" viewBox="-80 250 1090 920" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="screens" id="screens"></div>
      <svg class="layer" id="lines" viewBox="-80 250 1090 920" preserveAspectRatio="none" aria-hidden="true" style="pointer-events:none"></svg>
      <div class="placed" id="placed" aria-label="House"></div>
      <div class="banner"><button class="btn primary" id="again" type="button">Play again</button></div>
    </div>
  </div>

  <div class="sheet" id="sheet" aria-label="Stickers"></div>
</div>

<script>
/* =====================================================================
   SETTINGS
   ---------------------------------------------------------------------
   STICKERS: put your PNG files into  pieces/  and list them here:
     {src:"pieces/bed.png",   h:80}               h = height in the house, shown 3× bigger
     {src:"pieces/lamp.png",  h:50, snap:"free"}   (one room is 162 tall; never bigger than the room)
     {src:"pieces/sofa.png",  h:70, snap:"floor"}
   WALLPAPER vs OBJECT is decided by the picture itself: a picture with no transparency (a normal photo,
     JPG or opaque PNG) is a wallpaper; a cut-out PNG with transparent parts is an object.
     A file name starting with "wall" (wall_something.png) is always a wallpaper.
     Dropped on a room, the attic or the tower it covers that whole area behind the furniture; one per area,
     a new one sends the old one back to the sheet. This works for uploaded files too.
   Objects stay exactly where they are dropped (centre under the finger), anywhere on the stage.
   SLOTS: a picture whose file name contains "door", "window" or "stair"/"spiral" dropped on (or next to) the matching
     dashed drawing snaps into it and hides the drawing; one picture per slot. Anywhere else it is a normal object.
   ALLOW_UPLOAD: true shows a "+" on the sheet to test PNGs from your computer
                 (you can also drop files onto the sheet). Set false for the public site.
   ===================================================================== */
const STICKERS = [
  // {src:"pieces/bed.png", h:80},
  {src:"pieces/door.png", h:50, snap:"floor"},
  {src:"pieces/girl1.png", h:54, snap:"floor"},
  {src:"pieces/girl2.png", h:46, snap:"floor"},
  {src:"pieces/girl3.png", h:46, snap:"floor"},
  {src:"pieces/girl4.png", h:30, snap:"floor"},
  {src:"pieces/girl5.png", h:30, snap:"floor"},
  {src:"pieces/girl6.png", h:54, snap:"floor"},
  {src:"pieces/obj01.webp", h:40},
  {src:"pieces/obj02.webp", h:40},
  {src:"pieces/obj03.webp", h:40},
  {src:"pieces/obj04.webp", h:40},
  {src:"pieces/obj05.webp", h:40},
  {src:"pieces/obj06.webp", h:40},
  {src:"pieces/obj07.webp", h:40},
  {src:"pieces/obj08.webp", h:40},
  {src:"pieces/obj09.webp", h:40},
  {src:"pieces/obj10.webp", h:40},
  {src:"pieces/obj11.webp", h:40},
  {src:"pieces/obj12.webp", h:40},
  {src:"pieces/obj13.webp", h:40},
  {src:"pieces/obj14.webp", h:40},
  {src:"pieces/obj15.webp", h:40},
  {src:"pieces/obj16.webp", h:40},
  {src:"pieces/obj17.webp", h:40},
  {src:"pieces/obj18.webp", h:40},
  {src:"pieces/obj19.webp", h:40},
  {src:"pieces/obj20.webp", h:40},
  {src:"pieces/obj21.webp", h:40},
  {src:"pieces/obj22.webp", h:40},
  {src:"pieces/obj23.webp", h:40},
  {src:"pieces/obj24.webp", h:40},
  {src:"pieces/obj25.webp", h:40},
  {src:"pieces/obj26.webp", h:40},
  {src:"pieces/obj27.webp", h:40},
  {src:"pieces/obj28.webp", h:40},
  {src:"pieces/obj29.webp", h:40},
  {src:"pieces/obj30.webp", h:40},
  {src:"pieces/obj31.webp", h:40},
  {src:"pieces/obj32.webp", h:40},
  {src:"pieces/obj33.webp", h:40},
  {src:"pieces/obj34.webp", h:40},
  {src:"pieces/obj35.webp", h:40},
  {src:"pieces/obj36.webp", h:40},
  {src:"pieces/obj37.webp", h:40},
  {src:"pieces/obj38.webp", h:40},
  {src:"pieces/obj39.webp", h:40},
  {src:"pieces/obj40.webp", h:40},
  {src:"pieces/obj41.webp", h:40},
  {src:"pieces/obj42.webp", h:40},
  {src:"pieces/obj43.webp", h:40},
  {src:"pieces/obj44.webp", h:40},
  {src:"pieces/obj45.webp", h:40},
  {src:"pieces/obj46.webp", h:40},
  {src:"pieces/obj47.webp", h:40},
  {src:"pieces/obj48.webp", h:40},
  {src:"pieces/obj49.webp", h:40},
  {src:"pieces/obj50.webp", h:40},
  {src:"pieces/obj51.webp", h:40},
  {src:"pieces/obj52.webp", h:40},
];
const ALLOW_UPLOAD = true;
const UPLOAD_HEIGHT = 240;

const VIDEOS = []; // videos off for now; files stay in videos/ (v01.mp4 … v10.mp4)

// House geometry (800 × 1200 canvas). 4 floors × 2 rooms, floors 162 high; left rooms 16:9 (288 × 162),
// right rooms 16:9 on floors 1 and 4, 14:9 (252 × 162) on floors 2–3 with a 36-wide ladder strip on their left. + attic.
const ROOMS = [
  {id:"r1",x:100,y:512, w:288,h:162},{id:"r2",x:388,y:512, w:288,h:162},
  {id:"r3",x:100,y:674, w:288,h:162},{id:"r4",x:424,y:674, w:252,h:162},
  {id:"r5",x:100,y:836, w:288,h:162},{id:"r6",x:424,y:836, w:252,h:162},
  {id:"r7",x:100,y:998, w:288,h:162},{id:"r8",x:388,y:998, w:288,h:162},
];
const ATTIC = {id:"attic", poly:[[100,512],[230,300],[546,300],[676,512]], top:300, floor:512, video:false};
const TOWER = {id:"tower",x:676,y:512,w:210,h:648}; // inside of the tower below its roof, one wallpaper area

// Slots: the dashed door, windows and spiral stairs; box = bounding box of the drawing (canvas units), g = its SVG group id
const SLOTS = [
  {id:"door",         type:"door",   x:736, y:1015, w:90,  h:145},
  {id:"attic-win-l",  type:"window", x:250, y:357,  w:60,  h:90},
  {id:"attic-win-r",  type:"window", x:466, y:357,  w:60,  h:90},
  {id:"tower-win",    type:"window", x:736, y:516,  w:90,  h:90},
  {id:"stairs",       type:"stairs", x:-40, y:512,  w:124, h:648},
];
const SLOT_NEAR = 20; // a drop this close to a slot box still snaps
const slotType=name=>/door/i.test(name)?"door":/window/i.test(name)?"window":/stair|spiral/i.test(name)?"stairs":null;

/* ---------------- owner mode (?owner=shelest on, ?owner=off off; remembered in localStorage) ---------------- */
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
{const q=new URLSearchParams(location.search).get("owner"); if(q==="shelest")lsSet("dollhouse-owner",true); else if(q==="off")lsSet("dollhouse-owner",null);}
const OWNER=lsGet("dollhouse-owner",false)===true;
let removed=OWNER?lsGet("dollhouse-removed",[]):[];   // srcs of built-in stickers hidden by the owner (owner mode only)
let types=lsGet("dollhouse-types",{});                // src (built-in) or upload id -> "door" | "window" | "stairs"
const typeKey=it=>it.upload?it.id:it.src;
const typeOf=it=>types[typeKey(it)]||slotType(it.name);

/* ---------------- setup ---------------- */
const VB={x:-80,y:250,w:1090,h:920};       // drawing bounds (spiral stair -40 … ground 1000, chimneys 262 … ground 1160) + margin
const $=s=>document.querySelector(s);
const stage=$("#stage"), wrap=$("#wrap"), sheet=$("#sheet"), placedEl=$("#placed"), screens=$("#screens"), wallsEl=$("#walls");
const isWall=name=>/^wall/i.test(name);
const isJpeg=(name,type)=>type==="image/jpeg"||/\.jpe?g$/i.test(name);
const builtins=STICKERS.map((s,i)=>({id:"s"+i, src:s.src, name:s.src.split("/").pop(), h:(s.h||80)*3, snap:s.snap||"auto", ratio:1, wall:false, ready:false}));
let items=builtins.filter(it=>!removed.includes(it.src));
const pos={};            // id -> {room, x, y}  (x = centre, y = bottom, canvas units, room = area or null, slot = slot id); wallpapers: {room}
const AX=ATTIC.poly.map(p=>p[0]), AY=ATTIC.poly.map(p=>p[1]);
const ATTIC_BOX={x:Math.min(...AX),y:Math.min(...AY),w:Math.max(...AX)-Math.min(...AX),h:Math.max(...AY)-Math.min(...AY)};
let alive=false, lastClips=[];

function drawHouse(){
  const pts=ATTIC.poly.map(p=>p.join(",")).join(" ");
  const win=(x,y,w,h=w)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"/><path d="M${x+w/2} ${y}V${y+h}M${x} ${y+h/2}H${x+w}"/>`;
  let fine="", spiral="";
  // two attic windows, three chimneys
  fine+=`<g id="slot-attic-win-l">${win(250,357,60,90)}</g><g id="slot-attic-win-r">${win(466,357,60,90)}</g>`;
  [262,370,478].forEach(x=>fine+=`<path d="M${x} 300V262H${x+26}V300"/>`);
  // spiral stair outside the left wall: one smooth coil seen from the side, one loop per floor (ground 1160 … top 512),
  // drawn as cubic segments of x=cx-rx·cos, y=floor line-ry·sin (exact tangents); outside .fine so it takes the wall stroke
  {const cx=22,rx=62,ry=40,P=t=>[cx-rx*Math.cos(2*Math.PI*t),1160-162*t-ry*Math.sin(2*Math.PI*t)],
    D=t=>[2*Math.PI*rx*Math.sin(2*Math.PI*t),-162-2*Math.PI*ry*Math.cos(2*Math.PI*t)],q=v=>v.toFixed(1),n=8;
  let d=`M${P(0).map(q).join(" ")}`;
  for(let k=0;k<4*n;k++){const t0=k/n,t1=(k+1)/n,a=P(t0),b=P(t1),da=D(t0),db=D(t1),h=1/n/3;
    d+=`C${q(a[0]+da[0]*h)} ${q(a[1]+da[1]*h)} ${q(b[0]-db[0]*h)} ${q(b[1]-db[1]*h)} ${q(b[0])} ${q(b[1])}`}
  spiral=`<g id="slot-stairs"><path d="${d}"/></g>`;}
  // ladder in the strip between the columns, floors 2–3: the walls are the rails, 4 rungs per floor wall to wall
  fine+=`<path class="rung" d="`;
  for(let t=674;t<998;t+=162) for(let k=1;k<5;k++) fine+=`M388 ${t+162*k/5}H424`;
  fine+=`"/>`;
  // tower: window, three hatched flights going down, arched door
  fine+=`<g id="slot-tower-win">${win(736,516,90)}</g>`;
  [[600,1],[740,-1],[880,1]].forEach(([y,d])=>{const x0=d>0?706:856,x1=d>0?856:706;
    fine+=`<path d="M${x0} ${y}L${x1} ${y+100}M${x0} ${y+26}L${x1} ${y+126}`;
    for(let k=1;k<21;k++){const x=x0+(x1-x0)*k/21,yy=y+100*k/21; fine+=`M${x} ${yy}V${yy+26}`}
    fine+=`"/>`;});
  fine+=`<g id="slot-door"><path d="M736 1160V1060A45 45 0 0 1 826 1060V1160"/></g>`;
  // mailbox on a post
  fine+=`<path d="M944 1160V1024M908 1024V988A38 24 0 0 1 984 988V1024ZM976 988V952H956V968H976"/>`;
  $("#lines").innerHTML=`<g class="struct">
    <polygon points="${pts}"/>
    <rect x="100" y="512" width="576" height="648"/>
    <path d="M100 674H676M100 836H676M100 998H676M388 512V1160M424 674V998"/>
    <path d="M676 512L781 374L886 512V1160"/>
    <path d="M-70 1160H1000"/>
    ${spiral}
    <g class="fine">${fine}</g></g>`;
  $("#zones").innerHTML=ROOMS.map(r=>`<rect class="zone" data-room="${r.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`).join("")+
    `<polygon class="zone" data-room="attic" points="${pts}"/>`+
    `<rect class="zone" data-room="tower" x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/>`;
}

/* ---------------- geometry helpers ---------------- */
const scale=()=>stage.getBoundingClientRect().width/VB.w;          // px per canvas unit
function toCanvas(cx,cy){const r=stage.getBoundingClientRect();return [VB.x+(cx-r.left)/r.width*VB.w, VB.y+(cy-r.top)/r.height*VB.h]}
function inPoly(px,py,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c}return c}
function roomAt(x,y){
  const r=ROOMS.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h); if(r)return r;
  if(inPoly(x,y,ATTIC.poly)) return {id:"attic",attic:true};
  if(x>=TOWER.x&&x<=TOWER.x+TOWER.w&&y>=TOWER.y&&y<=TOWER.y+TOWER.h) return TOWER;
  return null;
}
const inRect=(cx,cy,el)=>{const r=el.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom};
function sizeOf(it){ // height/width in canvas units, never bigger than a normal room; in a slot: contained in the slot box
  const sl=pos[it.id]?.slot&&SLOTS.find(s=>s.id===pos[it.id].slot);
  if(sl){const w=Math.min(sl.w,sl.h*it.ratio); return {w,h:w/it.ratio}}
  const maxH=ROOMS[0].h*.92, maxW=ROOMS[0].w*.95;
  let h=Math.min(it.h,maxH), w=h*it.ratio; if(w>maxW){w=maxW;h=w/it.ratio}
  return {w,h};
}
function slotAt(it,x,y){ // nearest slot of the item's type around the drop point, or null
  const t=typeOf(it); if(!t||it.wall)return null;
  const d=s=>Math.hypot(Math.max(s.x-x,0,x-s.x-s.w),Math.max(s.y-y,0,y-s.y-s.h));
  return SLOTS.filter(s=>s.type===t&&d(s)<=SLOT_NEAR).sort((a,b)=>d(a)-d(b))[0]||null;
}
function putSlot(it,sl){ // one picture per slot: the previous one goes back to the sheet
  items.forEach(o=>{if(o!==it&&pos[o.id]?.slot===sl.id)delete pos[o.id]});
  pos[it.id]={room:null,slot:sl.id}; const {h}=sizeOf(it);
  pos[it.id].x=sl.x+sl.w/2; pos[it.id].y=sl.type==="window"?sl.y+sl.h/2+h/2:sl.y+sl.h;
}
function put(it,room,x,y){ // place a sticker (x,y = its centre); a wallpaper replaces the one already in that area
  if(it.wall){ items.forEach(o=>{if(o.wall&&o!==it&&pos[o.id]?.room===room.id)delete pos[o.id]}); pos[it.id]={room:room.id}; }
  else pos[it.id]={room:room?room.id:null,x,y:y+sizeOf(it).h/2};
}

/* ---------------- render ---------------- */
const thumbH=it=>Math.min(56,Math.max(32,sizeOf(it).h*scale())); // sticker size on the sheet, px
function renderSheet(){
  sheet.innerHTML=items.map(it=>
    `<button class="sticker${pos[it.id]?" used":""}" type="button" data-id="${it.id}" aria-label="Sticker"><img src="${it.src}" alt="" draggable="false" style="height:${thumbH(it)}px">${it.upload||OWNER?`<span class="del" role="button" tabindex="0" aria-label="Delete picture">×</span>`:""}${OWNER?`<span class="types">${["door","window","stairs"].map(t=>`<span role="button" tabindex="0" data-type="${t}" class="${types[typeKey(it)]===t?"on":""}">${t}</span>`).join("")}</span>`:""}</button>`).join("")+
    (items.length?"":`<p class="emptyNote">No stickers yet. Add PNG files in the settings${ALLOW_UPLOAD?" or press + to try some from your computer":""}.</p>`)+
    (ALLOW_UPLOAD?`<label class="add" title="Add PNG">+<input type="file" id="upload" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" multiple aria-label="Add PNG stickers"></label>`:"")+
    (OWNER?`<p class="ownerLine">removed: ${removed.length} - <a id="copyRemoved">copy list</a> - <a id="undoRemoved">undo all</a></p>`:"");
  sheet.querySelectorAll(".sticker").forEach(el=>{el.addEventListener("pointerdown",startDrag);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();autoPlace(el.dataset.id)}})});
  sheet.querySelectorAll(".del").forEach(x=>{const id=x.parentElement.dataset.id;
    x.addEventListener("pointerdown",e=>e.stopPropagation());
    x.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();removeItem(id)});
    x.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();removeItem(id)}})});
  sheet.querySelectorAll(".types span").forEach(b=>{const id=b.closest(".sticker").dataset.id;
    b.addEventListener("pointerdown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)});
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)}})});
  $("#copyRemoved")?.addEventListener("click",copyRemoved);
  $("#undoRemoved")?.addEventListener("click",undoRemoved);
  const up=$("#upload"); if(up) up.addEventListener("change",()=>{addFiles(up.files);up.value=""});
}
function renderPlaced(popId){
  // wallpapers live in the same viewBox as #lines: image = room rect, clipped by the room rect (attic: its polygon)
  wallsEl.innerHTML=`<defs>${ROOMS.map(r=>`<clipPath id="clip-${r.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/></clipPath>`).join("")}
    <clipPath id="clip-attic"><polygon points="${ATTIC.poly.map(p=>p.join(",")).join(" ")}"/></clipPath>
    <clipPath id="clip-tower"><rect x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/></clipPath></defs>`+
    items.filter(it=>it.wall&&pos[it.id]).map(it=>{const id=pos[it.id].room,b=ROOMS.find(r=>r.id===id)||(id==="tower"?TOWER:ATTIC_BOX);
    return `<image href="${it.src}" data-id="${it.id}" class="${popId===it.id?"pop":""}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"
      preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-${id})"/>`}).join("");
  wallsEl.querySelectorAll("image").forEach(el=>el.addEventListener("pointerdown",startDrag));
  SLOTS.forEach(s=>document.getElementById("slot-"+s.id)?.classList.toggle("filled",items.some(it=>pos[it.id]?.slot===s.id)));
  placedEl.innerHTML=items.filter(it=>!it.wall&&pos[it.id]).map(it=>{const p=pos[it.id],{h}=sizeOf(it);
    return `<img src="${it.src}" alt="" draggable="false" data-id="${it.id}" class="${popId===it.id?"pop":""}"
      style="left:${(p.x-VB.x)/VB.w*100}%;top:${(p.y-VB.y)/VB.h*100}%;height:${h/VB.h*100}%">`}).join("");
  placedEl.querySelectorAll("img").forEach(el=>el.addEventListener("pointerdown",startDrag));
  updateHud();
}
function render(popId){renderSheet();renderPlaced(popId)}
function placedCount(){return items.filter(it=>pos[it.id]).length}
function allPlaced(){return items.length>0&&placedCount()===items.length}
function updateHud(){ $("#progress").textContent=`${placedCount()} / ${items.length} placed`; $("#random").disabled=!items.some(it=>!pos[it.id]); }

/* ---------------- drag ---------------- */
let drag=null;
function startDrag(e){
  if(alive)return; const el=e.currentTarget, it=items.find(i=>i.id===el.dataset.id); if(!it||!it.ready)return;
  if(el.classList.contains("sticker")&&pos[it.id])return;
  el.setPointerCapture(e.pointerId);
  const gh=new Image(); gh.src=it.src; gh.className="ghost"; gh.style.height=thumbH(it)+"px"; document.body.appendChild(gh);
  drag={el,it,gh,x0:e.clientX,y0:e.clientY,moved:false,fromHouse:!!pos[it.id]};
  moveGhost(e.clientX,e.clientY);
  el.onpointermove=ev=>{ if(!drag.moved&&Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)>6){drag.moved=true; if(drag.fromHouse)el.classList.add("lift")}
    moveGhost(ev.clientX,ev.clientY); const [x,y]=toCanvas(ev.clientX,ev.clientY); hot(roomAt(x,y)) };
  el.onpointerup=ev=>endDrag(ev); el.onpointercancel=()=>endDrag(null);
}
function moveGhost(x,y){drag.gh.style.left=x+"px";drag.gh.style.top=y+"px"}
function hot(room){document.querySelectorAll(".zone").forEach(z=>z.classList.toggle("hot",!!room&&z.dataset.room===room.id))}
function endDrag(ev){
  const d=drag; drag=null; d.el.onpointermove=d.el.onpointerup=d.el.onpointercancel=null; hot(null);
  if(ev&&!d.moved){ d.gh.remove(); if(d.fromHouse){delete pos[d.it.id];render()} else autoPlace(d.it.id); return }
  const [x,y]=ev?toCanvas(ev.clientX,ev.clientY):[-1,-1], room=ev&&roomAt(x,y);
  // wallpapers need a room, the attic or the tower; objects stay anywhere on the stage except over the sheet
  if(d.it.wall?room:ev&&!inRect(ev.clientX,ev.clientY,sheet)&&inRect(ev.clientX,ev.clientY,stage)){ d.gh.remove(); const sl=slotAt(d.it,x,y); if(sl)putSlot(d.it,sl); else put(d.it,room,x,y); render(d.it.id); checkDone(); return }
  // otherwise → back to the sheet
  delete pos[d.it.id]; render();
  const home=sheet.querySelector(`[data-id="${d.it.id}"]`)?.getBoundingClientRect();
  if(home){ d.gh.classList.add("back"); Object.assign(d.gh.style,{left:home.left+home.width/2+"px",top:home.top+home.height/2+"px",opacity:"0"}); setTimeout(()=>d.gh.remove(),260) } else d.gh.remove();
}
function autoPlace(id){ if(alive)return; const it=items.find(i=>i.id===id); if(!it||!it.ready||pos[id])return;
  const rooms=it.wall?[...ROOMS,TOWER].filter(r=>!items.some(o=>o.wall&&pos[o.id]?.room===r.id)):ROOMS; if(!rooms.length)return;
  const counts=rooms.map(r=>items.filter(i=>pos[i.id]?.room===r.id).length), min=Math.min(...counts);
  const choices=rooms.filter((r,i)=>counts[i]===min), room=choices[Math.floor(Math.random()*choices.length)];
  const {w,h}=sizeOf(it); // objects: inside the room, standing on its floor
  put(it,room,room.x+w/2+4+Math.random()*Math.max(0,room.w-w-8),room.y+room.h-2-h/2);
  render(id); checkDone();
}

/* ---------------- test uploads ---------------- */
function addFiles(files){
  [...files].filter(f=>/^image\//.test(f.type)).forEach(f=>{
    const src=URL.createObjectURL(f), it={id:"u"+Math.random().toString(36).slice(2,8),src,name:f.name,type:f.type,h:UPLOAD_HEIGHT,snap:"auto",ratio:1,wall:false,ready:false,upload:true,blob:f,added:Date.now()};
    items.push(it); measure(it);
  }); render();
}
function removeUpload(id){
  if(alive)return; const it=items.find(i=>i.id===id); if(!it||!it.upload)return;
  items=items.filter(i=>i!==it); delete pos[id]; URL.revokeObjectURL(it.src); dbDel(id);
  if(types[id]){delete types[id]; lsSet("dollhouse-types",types)} render();
}
function removeItem(id){ // uploads: delete; built-ins (owner mode): hide in this browser
  const it=items.find(i=>i.id===id); if(!it)return; if(it.upload)return removeUpload(id);
  if(alive||!OWNER)return; items=items.filter(i=>i!==it); delete pos[id];
  if(!removed.includes(it.src)){removed.push(it.src); lsSet("dollhouse-removed",removed)} render();
}
function undoRemoved(){ if(alive)return; removed=[]; lsSet("dollhouse-removed",null); items=[...builtins,...items.filter(i=>i.upload)]; render() }
function copyRemoved(){
  const text=removed.map(s=>s.split("/").pop()).join("\n"), done=()=>{const a=$("#copyRemoved"); if(a){a.textContent="copied"; setTimeout(()=>{if(a.isConnected)a.textContent="copy list"},1200)}};
  const fallback=()=>{const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy")}catch(e){} t.remove(); done()};
  navigator.clipboard?navigator.clipboard.writeText(text).then(done,fallback):fallback();
}
function toggleType(id,t){ // mark a picture as door / window / stairs (overrides the file-name rule); again clears it
  const it=items.find(i=>i.id===id); if(!it)return; const k=typeKey(it);
  if(types[k]===t)delete types[k]; else types[k]=t; lsSet("dollhouse-types",types); renderSheet();
}
// saved uploads: IndexedDB "dollhouse" / "uploads", key = item id. Any failure → behave as without saving.
let dbP=null;
function db(){ if(!dbP) dbP=new Promise((ok,no)=>{const r=indexedDB.open("dollhouse",1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("uploads"))r.result.createObjectStore("uploads")};
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error)}); return dbP }
function dbTx(mode,fn){ try{ return db().then(d=>new Promise((ok,no)=>{const t=d.transaction("uploads",mode),req=fn(t.objectStore("uploads"));
    t.oncomplete=()=>ok(req&&req.result); t.onerror=t.onabort=()=>no(t.error)})).catch(()=>{}) }catch(e){ return Promise.resolve() } }
function dbPut(it){ if(items.includes(it)) dbTx("readwrite",s=>s.put({id:it.id,blob:it.blob,name:it.name,type:it.type,wall:it.wall,added:it.added},it.id)) }
function dbDel(id){ dbTx("readwrite",s=>s.delete(id)) }
function loadUploads(){ dbTx("readonly",s=>s.getAll()).then(rows=>{ if(!rows||!rows.length)return;
  rows.sort((a,b)=>(a.added||0)-(b.added||0)).forEach(r=>{ if(!r||!r.blob||items.some(i=>i.id===r.id))return;
    const it={id:r.id,src:URL.createObjectURL(r.blob),name:r.name||"",type:r.type||r.blob.type,h:UPLOAD_HEIGHT,snap:"auto",ratio:1,wall:!!r.wall,ready:false,upload:true,blob:r.blob,added:r.added||0,saved:true};
    items.push(it); measure(it); });
  render(); }) }
if(ALLOW_UPLOAD){
  sheet.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("Files"))e.preventDefault()});
  sheet.addEventListener("drop",e=>{if(!e.dataTransfer.files.length)return;e.preventDefault();addFiles(e.dataTransfer.files)});
}
function opaque(im){ // fewer than 1% of pixels with alpha < 250 → no transparency
  const k=64/Math.max(im.naturalWidth||64,im.naturalHeight||64,64), w=Math.max(1,Math.round((im.naturalWidth||64)*k)), h=Math.max(1,Math.round((im.naturalHeight||64)*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(im,0,0,w,h);
  const a=g.getImageData(0,0,w,h).data; let n=0; for(let i=3;i<a.length;i+=4) if(a[i]<250) n++;
  return n<w*h*.01;
}
function measure(it){const im=new Image(); im.onload=()=>{it.ratio=im.naturalWidth/im.naturalHeight||1;
    if(!it.saved){ if(isWall(it.name)||isJpeg(it.name,it.type)) it.wall=true; else try{it.wall=opaque(im)}catch(e){it.wall=false} }
    it.ready=true; if(it.upload&&!it.saved){it.saved=true; dbPut(it)} render()};
  im.onerror=()=>{if(!it.saved)it.wall=isWall(it.name)||isJpeg(it.name,it.type); it.ready=true; if(it.upload&&!it.saved){it.saved=true; dbPut(it)} render()}; im.src=it.src}

/* ---------------- the house comes alive ---------------- */
function checkDone(){ if(allPlaced()) setTimeout(wake,500) }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickClips(n){
  let pick,t=0; do{ pick=shuffle(VIDEOS.slice()).slice(0,n); t++ }while(t<30&&pick.join()===lastClips.join());
  while(pick.length<n) pick.push(VIDEOS[Math.floor(Math.random()*VIDEOS.length)]);
  lastClips=pick; return pick;
}
function wake(){
  if(alive||!allPlaced())return; alive=true; sheet.classList.add("locked");
  screens.innerHTML="";
  if(VIDEOS.length){ const clips=pickClips(ROOMS.length);
  shuffle(ROOMS.map((_,i)=>i)).forEach((ri,k)=>{const r=ROOMS[ri],v=document.createElement("video");
    Object.assign(v,{src:clips[ri],muted:true,loop:true,playsInline:true,autoplay:true}); v.setAttribute("playsinline","");
    Object.assign(v.style,{left:(r.x-VB.x)/VB.w*100+"%",top:(r.y-VB.y)/VB.h*100+"%",width:r.w/VB.w*100+"%",height:r.h/VB.h*100+"%"});
    screens.appendChild(v); v.play().catch(()=>{}); setTimeout(()=>v.classList.add("on"),200+k*260);
  }); }
  wrap.classList.add("alive");
}
function reset(){
  screens.querySelectorAll("video").forEach(v=>v.classList.remove("on")); wrap.classList.remove("alive");
  stage.querySelectorAll(".placed img,.walls image").forEach(i=>i.style.opacity="0");
  setTimeout(()=>{for(const k in pos)delete pos[k]; screens.innerHTML=""; alive=false; sheet.classList.remove("locked"); render()},350);
}
$("#again").addEventListener("click",reset);
$("#reset").addEventListener("click",reset);
$("#random").addEventListener("click",()=>{ if(alive)return; items.filter(it=>!pos[it.id]).forEach((it,i)=>setTimeout(()=>autoPlace(it.id),i*60)) });
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderSheet,120)});

drawHouse(); builtins.forEach(measure); render(); if(ALLOW_UPLOAD) loadUploads();
</script>
</body>
