<html lang="en">

<style>
/* loading widget: shown from the first paint until the scene layers, the stickers and saved uploads are ready */
#loader{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .2s;
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;font-size:12px;color:#666}
/* loader-house.webp: animated pixel art, 160 × 212, shown at an integer scale (2×, 1× on narrow screens), never cropped */
#loader img{display:block;width:320px;height:424px;flex:none;object-fit:contain;image-rendering:pixelated}
@media (max-width:479px),(max-height:519px){#loader img{width:160px;height:212px}}
#loader.out{opacity:0;pointer-events:none}
</style>
<style>
/* Layout: the scene (separate picture layers on an 8800 × 4946 artboard, 16:9) fitted above the sticker sheet. Black on white, square corners. */
:root{
  --bg:#ffffff; --ink:#000000; --dim:rgba(0,0,0,.35); --faint:rgba(0,0,0,.05); --muted:#666666;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:max(4px,env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
*{border-radius:0}
.app{position:relative;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:0;min-height:0}
/* the header floats over the top of the wall so the scene can start at the top edge of the window */
header{position:absolute;top:6px;left:0;right:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.how{margin:0;max-width:70ch;font-size:12px;line-height:1.3;color:var(--muted)}
.hud{pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;line-height:1.3}
#progress{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--bg);border:1px solid var(--ink);padding:3px 8px;font-size:12px;line-height:1.3}
.btn:hover,.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* scene: 16:9 (8800 × 4946), cover-fitted to the area above the sheet: scale = max(window width / 8800, area height / 4946),
   centred horizontally, bottom-aligned (floor and house never cut, only the top of the wall or the sides may be cropped).
   The area spans the full window width (out of the body padding). Each layer = layers/<name>.webp placed in % of the artboard
   (left x/8800, top y/4946, width w/8800), stacked by z, so every layer, sticker and editor handle shares one scale and offset */
.stageWrap{position:relative;width:100vw;margin-left:calc(50% - 50vw);flex:none;height:calc(100% - var(--tbh,0px));min-height:0;container-type:size;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.scene{position:relative;z-index:0;flex:none;width:max(100vw,calc((100dvh - 120px) * 8800 / 4946));width:max(100cqw,100cqh * 8800 / 4946);aspect-ratio:8800/4946}
.ly{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.ly.vin{opacity:0;transition:opacity .3s ease}
/* colour variant button: bottom-left corner of the stage, under the editor panel (z 20) if they ever meet */
.varBtn{position:absolute;left:10px;bottom:10px;z-index:15;width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);padding:0;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.varBtn:hover{background:var(--ink)}
/* the game area = the box of the house layer; stickers live in its units (VB). z 30 = above every scene layer (house, stairs, girl,
   legs, mailbox, items: z ≤ 21, raised layers in the editor 29), so dropped stickers always stay in front; the sheet and editor UI are above the scene */
.stage{position:absolute;z-index:30}
.sheet{position:relative;z-index:1;background:var(--bg)}
.layer{position:absolute;inset:0;width:100%;height:100%}
.screens{position:absolute;inset:0;pointer-events:none;z-index:1}
.screens video{position:absolute;display:block;object-fit:cover;opacity:0;transition:opacity .7s ease;background:var(--ink)}
.screens .on{opacity:1}
.stage .tag{position:absolute;z-index:2;pointer-events:none;margin:4px;padding:1px 4px;background:var(--ink);color:var(--bg);font-size:10px;line-height:1.3;white-space:nowrap}
.zone{fill:transparent;stroke:none;transition:fill .15s}
.zone.hot{fill:var(--faint)}
.walls{position:absolute;inset:0;pointer-events:none}
.walls image{pointer-events:auto;touch-action:none;cursor:grab}
.walls image.lift{opacity:.25}
.walls image.pop{animation:fade .3s ease-out}
.walls image{transition:opacity .7s ease}
.walls image.gone,.placed img.gone{opacity:0;pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alive .walls image{cursor:default}
.placed{position:absolute;inset:0;pointer-events:none}
.placed img{pointer-events:auto;position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;-webkit-user-drag:none;transition:left .25s ease,top .25s ease,opacity .7s ease}
.placed img.lift{opacity:.25;transition:none}
.placed img.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.9)}to{opacity:1;transform:translate(-50%,-100%)}}
.alive .placed img{cursor:default}
.banner{position:absolute;left:50%;top:24%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
.alive .banner{opacity:1;pointer-events:auto}

/* sticker sheet: fixed over the bottom of the window, above the scene, below the editor UI. The scene area is always the window
   minus the sheet height at the DEFAULT sizes (--tbh, see renderSheet), so a bigger toolbar or bigger tray items just cover more of the scene */
.sheet{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(4px,env(safe-area-inset-bottom,0px));--t:22px;--o:-4px;flex:0 0 auto;max-height:calc(17vh * var(--tb,1));max-height:calc(17dvh * var(--tb,1));overflow:hidden;box-sizing:border-box;padding:2px 2px 2px 6px;margin:0;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-start;gap:1px;transition:opacity .3s}
.sheet.locked{opacity:.3;pointer-events:none}
.sticker{position:relative;border:0;padding:0;margin:0 0 0 var(--o);display:grid;place-items:end center;background:transparent;touch-action:none;cursor:grab;min-width:0;transition:opacity .15s,transform .15s}
.sticker:hover{opacity:.75;transform:scale(1.04)}
.sticker:active{transform:scale(.97)}
.sticker img{display:block;pointer-events:none;-webkit-user-drag:none;height:var(--t);width:auto}
.sticker.used{display:none}
.del{position:absolute;top:0;right:0;width:9px;height:9px;padding:0;display:grid;place-items:center;background:none;border:0;color:var(--ink);font-size:8px;line-height:1;cursor:pointer;touch-action:none;z-index:1}
.del::before{content:"";position:absolute;inset:0;background:var(--bg,#fff);border:1px solid var(--dim);z-index:-1}
.del:hover::before{border-color:var(--ink)}
.add{border:0;margin-left:2px;color:var(--muted);font-size:14px;width:var(--t);height:var(--t);display:grid;place-items:center;position:relative;cursor:pointer;transition:opacity .15s,transform .15s}
.add:hover{color:var(--ink);transform:scale(1.04)}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.types{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:1px;z-index:1;pointer-events:none}
.types span{width:8px;height:8px;box-sizing:border-box;display:grid;place-items:center;font-size:6px;line-height:1;padding:0;border:1px solid var(--dim);color:var(--muted);background:var(--bg);cursor:pointer;touch-action:none;pointer-events:auto}
.types span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ownerLine{flex:1 1 100%;margin:0;font-size:10px;line-height:1.2;color:var(--muted)}
.ownerLine a{color:inherit;cursor:pointer;text-decoration:underline}
.emptyNote{color:var(--muted);margin:0;align-self:center;flex:1 1 200px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
.ghost.back{transition:all .25s ease-in}
/* editor (?edit=1): every layer can be picked; zoom resizes the scene (sharp pictures), pan moves it */
.editing .stageWrap{cursor:default}
.editing .scene{width:calc(max(100cqw,100cqh * 8800 / 4946) * var(--zoom,1))}
.editing .stage *{pointer-events:none!important}
#selLayer{position:absolute;inset:0;pointer-events:none;z-index:40}
#selLayer .ol{position:absolute;outline:1px dashed rgba(0,0,0,.45)}
#selLayer .box{position:absolute;outline:1px solid var(--ink)}
#selLayer .h{position:absolute;width:10px;height:10px;background:var(--bg);border:1px solid var(--ink);box-sizing:border-box;transform:translate(-50%,-50%);pointer-events:auto}
#selLayer .h[data-h=nw],#selLayer .h[data-h=se]{cursor:nwse-resize}
#selLayer .h[data-h=ne],#selLayer .h[data-h=sw]{cursor:nesw-resize}
.etools{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--ink);padding:3px 6px;font-size:12px;line-height:1.3;white-space:nowrap}
.etools input[type=range]{width:120px}
.etools .st{color:var(--muted)}
.sheet .sticker.tsel{outline:1px solid var(--ink);outline-offset:1px}
.epanel{position:fixed;right:6px;top:40px;z-index:20;width:240px;max-width:calc(100vw - 12px);max-height:min(70vh,calc(100vh - 48px));display:flex;flex-direction:column;background:rgba(255,255,255,.85);border:1px solid var(--ink);font-size:10px;line-height:1.25;box-sizing:border-box;transition:opacity .15s,background .15s}
.epanel:hover{background:var(--bg)}
.epanel.left{right:auto;left:6px}
.epanel.collapsed{display:none}
body.edrag .epanel,body.edrag .epanelBtn{pointer-events:none;opacity:.25}
.epanel .ehead{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 6px;border-bottom:1px solid var(--ink);cursor:move;user-select:none;touch-action:none;flex:none}
.epanel .ehead b{flex:1;font-weight:400}
.epanel .ehead .btn{font-size:10px;padding:0 5px;cursor:pointer}
.epanel .ebody{overflow:auto;padding:4px 6px 6px;display:flex;flex-direction:column;gap:3px;min-height:0}
.epanel details{border-top:1px solid var(--faint)}
.epanel details>div{display:flex;flex-direction:column;gap:4px;padding:2px 0 4px}
.epanel summary{cursor:pointer;padding:2px 0;color:var(--ink)}
.epanel h4{margin:2px 0 0;font-size:10px;font-weight:400;color:var(--muted)}
.epanel .ll{display:flex;flex-direction:column;max-height:28vh;overflow:auto;border:1px solid var(--faint)}
.epanel .ll label{display:flex;align-items:center;gap:4px;padding:0 3px;cursor:pointer;white-space:nowrap}
.epanel .ll label.on{background:var(--ink);color:var(--bg)}
.epanel .ll input{margin:0}
.epanel .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.epanel .nums input,.epanel input[type=number]{width:100%;box-sizing:border-box;font:inherit;font-size:10px;padding:1px 2px;border:1px solid var(--dim)}
.epanel .row{display:flex;align-items:center;gap:4px}
.epanel .row input[type=range]{flex:1;min-width:0}
.epanel .row input[type=number]{width:48px;flex:none}
.epanel .btn{font-size:10px;padding:1px 5px}
.epanel .btn.big{font-size:14px;padding:0 8px;line-height:1.2;flex:none}
.epanel .wrapRow{flex-wrap:wrap}
.epanelBtn{position:fixed;right:6px;top:40px;z-index:20;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);font-size:12px;line-height:1;padding:0;cursor:pointer;display:none}
.epanelBtn.left{right:auto;left:6px}
.epanelBtn.on{display:block}
.editing .placed img{transition:opacity .7s ease}
@media (max-width:860px){ header{flex-wrap:wrap;row-gap:4px} }
/* phones: same cover-fitted scene above the sheet */
@media (max-width:700px){
  body{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .sheet{padding:2px 0 2px 4px;left:max(4px,env(safe-area-inset-left,0px));right:max(4px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="loader" role="status"><img src="loader-house.webp" alt="" width="320" height="424"><span>loading...</span></div>

<div class="app">
  <header>
    <p class="how">Drag stickers into the house. Use every sticker and it comes alive.</p>
    <div class="hud">
      <span id="progress"></span>
      <button class="btn" id="random" type="button">Random</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
  </header>

  <div class="stageWrap" id="wrap">
    <div class="scene" id="scene">
        <div id="layers"></div>
    <div class="stage" id="stage">
      <svg class="layer" id="zones" viewBox="0 0 3097 3040" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg class="layer walls" id="walls" viewBox="0 0 3097 3040" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="screens" id="screens"></div>
      <div class="placed" id="placed" aria-label="House"></div>
      <div class="banner"><button class="btn primary" id="again" type="button">Play again</button></div>
    </div>
    <div id="selLayer"></div>
    </div>
    <button class="varBtn" id="varBtn" type="button" title="Change colours" aria-label="Change colours">🎃</button>
  </div>

  <div class="sheet" id="sheet" aria-label="Stickers"></div>
</div>

<script>
/* =====================================================================
   SETTINGS
   ---------------------------------------------------------------------
   STICKERS: put your PNG files into  pieces/  and list them here:
     {src:"pieces/bed.png",   h:80}               h = height in the house, shown 3× bigger
     {src:"pieces/lamp.png",  h:50, snap:"free"}   (one room is 162 tall; never bigger than the room)
     {src:"pieces/sofa.png",  h:70, snap:"floor"}
   WALLPAPER vs OBJECT is decided by the picture itself: a picture with no transparency (a normal photo,
     JPG or opaque PNG) is a wallpaper; a cut-out PNG with transparent parts is an object.
     A file name starting with "wall" (wall_something.png) is always a wallpaper.
     Dropped on a room or the tower it covers that whole area behind the furniture; one per area,
     a new one sends the old one back to the sheet. This works for uploaded files too.
   Objects stay exactly where they are dropped (centre under the finger), anywhere on the stage.
   SLOTS: a picture whose file name contains "door" or "window" dropped on (or next to) the door or a tower window
     of the house snaps into it; one picture per slot. Anywhere else it is a normal object.
   ALLOW_UPLOAD: true shows a "+" on the sheet to test PNGs from your computer
                 (you can also drop files onto the sheet). Set false for the public site.
   ===================================================================== */
/* FINALE: when the house is dressed a video plays in ONE room, cut to the room and covering it;
   the stickers and wallpaper of that room fade out while it plays. All other rooms keep their objects.
   room id -> video file (r1 r2 = top floor left/right … r7 r8 = ground floor, tower = inside of the tower).
   Only the first room listed gets a video. */
const ROOM_VIDEOS = {
  r1:"finale.mp4",
};

/* SCENE: layers/<name>.webp on an 8800 × 4946 artboard (the files are drawn at 50 %); x, y = top-left, w, h = size, z = stacking
   (higher is in front). item-* layers are not part of the scene: they are the first stickers on the sheet, at their artboard size. */
const ART={w:8800,h:4946}, HIDDEN=["outlet-left"];
const DEFAULT_LAYERS=[{"name":"background-wall","group":"background","z":0,"x":0,"y":0,"w":8800,"h":4004},{"name":"floor","group":"background","z":1,"x":0,"y":3672,"w":8800,"h":1274},{"name":"floor-splashes","group":"background","z":2,"x":0,"y":3665,"w":8800,"h":1281},{"name":"leg-left","group":"scene","z":8,"x":900,"y":0,"w":1725,"h":3771},{"name":"leg-right","group":"scene","z":8,"x":5096,"y":0,"w":2840,"h":3804},{"name":"outlet-left","group":"background","z":-1,"x":1268,"y":1713,"w":708,"h":1145},{"name":"outlet-right","group":"background","z":3,"x":6843,"y":743,"w":708,"h":1145},{"name":"outside-stairs","group":"scene","z":4,"x":2223,"y":1512,"w":391,"h":2245},{"name":"house","group":"scene","z":5,"x":2453,"y":784,"w":3097,"h":3040},{"name":"girl","group":"scene","z":9,"x":5625,"y":1401,"w":1060,"h":2422},{"name":"speech-bubble","group":"scene","z":10,"x":4747,"y":232,"w":2056,"h":1365},{"name":"mailbox","group":"scene","z":11,"x":5476,"y":3458,"w":172,"h":414},{"name":"item-audiocontroller","group":"toolbar-item","z":20,"x":3870,"y":2457,"w":261,"h":88},{"name":"item-bearbrick-copy","group":"toolbar-item","z":20,"x":3893,"y":1697,"w":166,"h":355},{"name":"item-cage","group":"toolbar-item","z":20,"x":3001,"y":2765,"w":180,"h":359},{"name":"item-car","group":"toolbar-item","z":20,"x":2745,"y":2266,"w":654,"h":328},{"name":"item-cdp","group":"toolbar-item","z":20,"x":3672,"y":2739,"w":186,"h":371},{"name":"item-ipod-nano-pink","group":"toolbar-item","z":20,"x":3922,"y":3291,"w":166,"h":383},{"name":"item-lamp-1","group":"toolbar-item","z":20,"x":3964,"y":2121,"w":378,"h":249},{"name":"item-lamp-2","group":"toolbar-item","z":20,"x":2781,"y":2663,"w":91,"h":253},{"name":"item-lamp-2-copy","group":"toolbar-item","z":20,"x":3725,"y":1608,"w":91,"h":253},{"name":"item-lamp-3","group":"toolbar-item","z":20,"x":2719,"y":1580,"w":378,"h":249},{"name":"item-lamp-copy","group":"toolbar-item","z":20,"x":3996,"y":2763,"w":372,"h":355},{"name":"item-pc","group":"toolbar-item","z":20,"x":4239,"y":2984,"w":106,"h":141},{"name":"item-radio","group":"toolbar-item","z":20,"x":3661,"y":2317,"w":200,"h":234},{"name":"item-skull","group":"toolbar-item","z":20,"x":3100,"y":1748,"w":340,"h":308},{"name":"item-tv","group":"toolbar-item","z":20,"x":2725,"y":3423,"w":313,"h":242},{"name":"item-tv-2","group":"toolbar-item","z":20,"x":4074,"y":1810,"w":335,"h":247},{"name":"item-window","group":"toolbar-item","z":20,"x":3919,"y":1629,"w":196,"h":304},{"name":"item-window-copy-2","group":"toolbar-item","z":20,"x":2994,"y":3247,"w":196,"h":304}];
let LAYERS=DEFAULT_LAYERS.map(l=>({...l}));
// sticker tray sizes (dollhouse-layout.json: toolbarScale = tray height, trayItemsScale = all items, trayItems = {layer name: scale})
const DEFAULT_TRAY={toolbarScale:1,trayItemsScale:1,trayItems:{}};
let TRAY={...DEFAULT_TRAY,trayItems:{}};
const trayKey=it=>it.upload?null:it.name.replace(/\.webp$/,"");
const trayScaleOf=it=>TRAY.trayItemsScale*((trayKey(it)&&TRAY.trayItems[trayKey(it)])||1);
const isItem=name=>/^item-/.test(name);

const STICKERS = [
  ...DEFAULT_LAYERS.filter(l=>isItem(l.name)).map(l=>({src:`layers/${l.name}.webp`, h:l.h, art:true})),
];
const ALLOW_UPLOAD = true;
const UPLOAD_HEIGHT = 240; // ×K below

// House geometry = artboard units inside the house layer (house.webp at 3097 × 3040). 4 floors × 2 rooms + the tower above the door;
// a wallpaper covers one of these areas. K = old room height (162) → new, keeps sticker sizes relative to a room.
const ROOMS = [
  {id:"r1",x:128,y:768, w:910,h:488},{id:"r2",x:1066,y:768, w:948,h:488},
  {id:"r3",x:128,y:1328,w:910,h:468},{id:"r4",x:1066,y:1328,w:948,h:468},
  {id:"r5",x:128,y:1872,w:910,h:436},{id:"r6",x:1066,y:1872,w:948,h:436},
  {id:"r7",x:128,y:2426,w:910,h:416},{id:"r8",x:1066,y:2426,w:948,h:416},
];
const K = 488/162;
const TOWER = {id:"tower",x:2108,y:768,w:674,h:1540}; // inside of the tower above the door, one wallpaper area

// Slots: the door and the three tower windows of the house picture; box = its place in house units
const SLOTS = [
  {id:"door",         type:"door",   x:2343, y:2472, w:176, h:396},
  {id:"tower-win-1",  type:"window", x:2360, y:900,  w:140, h:230},
  {id:"tower-win-2",  type:"window", x:2360, y:1420, w:140, h:230},
  {id:"tower-win-3",  type:"window", x:2360, y:1930, w:140, h:230},
];
const SLOT_NEAR = 40; // a drop this close to a slot box still snaps
const slotType=name=>/door/i.test(name)?"door":/window/i.test(name)?"window":/stair|spiral/i.test(name)?"stairs":null;

/* ---------------- owner mode (only while the URL has ?owner=shelest; never remembered) ---------------- */
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
lsSet("dollhouse-owner",null); // clean up the old remembered flag
const OWNER=new URLSearchParams(location.search).get("owner")==="shelest";
let removed=OWNER?lsGet("dollhouse-removed",[]):[];   // srcs of built-in stickers hidden by the owner (owner mode only)
let types=lsGet("dollhouse-types",{});                // src (built-in) or upload id -> "door" | "window" | "stairs"
const typeKey=it=>it.upload?it.id:it.src;
const typeOf=it=>types[typeKey(it)]||slotType(it.name);

/* ---------------- setup ---------------- */
const VB={x:0,y:0,w:3097,h:3040};          // the house layer box
const $=s=>document.querySelector(s);
const stage=$("#stage"), wrap=$("#wrap"), sheet=$("#sheet"), placedEl=$("#placed"), screens=$("#screens"), wallsEl=$("#walls");
const isWall=name=>/^wall/i.test(name);
const neverWall=it=>!it.upload||isItem(it.name); // built-in tray items (item-*.webp) are always objects, whatever their pixels look like
const isJpeg=(name,type)=>type==="image/jpeg"||/\.jpe?g$/i.test(name);
const builtins=STICKERS.map((s,i)=>({id:"s"+i, src:s.src, name:s.src.split("/").pop(), h:s.art?s.h:(s.h||80)*3*K, snap:s.snap||"auto", ratio:1, wall:false, ready:false}));
removed=removed.filter(src=>builtins.some(b=>b.src===src)); // ignore saved entries of stickers that no longer exist
let items=builtins.filter(it=>!removed.includes(it.src));
let videoRoom=null;     // room whose stickers are hidden while its finale video plays
const pos={};            // id -> {room, x, y}  (x = centre, y = bottom, canvas units, room = area or null, slot = slot id); wallpapers: {room}
let alive=false;

function drawHouse(){ // the picture is a scene layer; only the drop zones are drawn
  $("#zones").innerHTML=ROOMS.map(r=>`<rect class="zone" data-room="${r.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`).join("")+
    `<rect class="zone" data-room="tower" x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/>`;
}

/* ---------------- geometry helpers ---------------- */
const scale=()=>stage.getBoundingClientRect().width/VB.w;          // px per canvas unit
const PHONE=matchMedia("(max-width:700px)");
let SY=1; // vertical stretch of the house on phones (1 … 2.2): one canvas unit is SY times taller than wide on screen
function measureStretch(){ const r=stage.getBoundingClientRect(); stage.style.setProperty("--k",r.width/VB.w);
  return PHONE.matches&&r.width?Math.min(2.2,Math.max(1,(r.height/VB.h)/(r.width/VB.w))):1 }
function toCanvas(cx,cy){const r=stage.getBoundingClientRect();return [VB.x+(cx-r.left)/r.width*VB.w, VB.y+(cy-r.top)/r.height*VB.h]}
function roomAt(x,y){
  const r=ROOMS.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h); if(r)return r;
  if(x>=TOWER.x&&x<=TOWER.x+TOWER.w&&y>=TOWER.y&&y<=TOWER.y+TOWER.h) return TOWER;
  return null;
}
const inRect=(cx,cy,el)=>{const r=el.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom};
function sizeOf(it,raw){ // height/width in canvas units, never bigger than a normal room; in a slot: contained in the slot box; × pos.s (editor size) unless raw
  // hy = the height in vertical canvas units (= h / SY on a stretched phone house, so the picture keeps its aspect)
  const sl=pos[it.id]?.slot&&SLOTS.find(s=>s.id===pos[it.id].slot);
  if(sl){const w=Math.min(sl.w,sl.h*SY*it.ratio); return {w,h:w/it.ratio,hy:w/it.ratio/SY}}
  const maxH=ROOMS[0].h*.92, maxW=ROOMS[0].w*.95;
  let h=Math.min(it.h,maxH), w=h*it.ratio; if(w>maxW){w=maxW;h=w/it.ratio}
  const s=raw?1:pos[it.id]?.s||1; h*=s; w*=s;
  return {w,h,hy:h/SY};
}
function slotAt(it,x,y){ // nearest slot of the item's type around the drop point, or null
  const t=typeOf(it); if(!t||it.wall)return null;
  const d=s=>Math.hypot(Math.max(s.x-x,0,x-s.x-s.w),Math.max(s.y-y,0,y-s.y-s.h));
  return SLOTS.filter(s=>s.type===t&&d(s)<=SLOT_NEAR).sort((a,b)=>d(a)-d(b))[0]||null;
}
function putSlot(it,sl){ // one picture per slot: the previous one goes back to the sheet
  items.forEach(o=>{if(o!==it&&pos[o.id]?.slot===sl.id)delete pos[o.id]});
  pos[it.id]={room:null,slot:sl.id}; slotPos(it,sl);
}
function slotPos(it,sl){ const {hy}=sizeOf(it); pos[it.id].x=sl.x+sl.w/2; pos[it.id].y=sl.type==="window"?sl.y+sl.h/2+hy/2:sl.y+sl.h }
function put(it,room,x,y){ // place a sticker (x,y = its centre); a wallpaper replaces the one already in that area
  if(it.wall){ items.forEach(o=>{if(o.wall&&o!==it&&pos[o.id]?.room===room.id)delete pos[o.id]}); pos[it.id]={room:room.id}; }
  else { const o=pos[it.id]; pos[it.id]={room:room?room.id:null,x,y:0,s:o?.s,z:o?.z}; pos[it.id].y=y+sizeOf(it).hy/2 } // keeps its editor size and order
}

/* ---------------- render ---------------- */
function fitSheet(){ // largest thumbnail height (max 22px phone / 28px desktop, min 14px) at which all stickers fit without scrolling
  sheet.style.setProperty("--tb",TRAY.toolbarScale);
  const max=Math.round((innerWidth<=860?22:28)*TRAY.toolbarScale), min=Math.min(14,max);
  for(let t=max;t>=min;t--){ sheet.style.setProperty("--t",t+"px"); sheet.style.setProperty("--o",-Math.min(4,Math.round(t*.18))+"px");
    if(sheet.scrollHeight<=sheet.clientHeight+1) break; }
}
function renderSheet(){
  // measure the sheet at the default sizes first: that height (--tbh) fixes the scene area, whatever the real tray sizes are
  const real=TRAY; TRAY={...DEFAULT_TRAY,trayItems:{}}; sheetHTML(); fitSheet();
  document.querySelector(".app").style.setProperty("--tbh",sheet.offsetHeight+"px"); TRAY=real;
  sheetHTML();
  bindSheet();
  fitSheet();
}
function sheetHTML(){
  sheet.innerHTML=items.map(it=>
    `<button class="sticker${pos[it.id]?" used":""}${EDIT&&traySel&&trayKey(it)===traySel?" tsel":""}" type="button" data-id="${it.id}" aria-label="Sticker"><img src="${it.src}" alt="" draggable="false" style="height:calc(var(--t) * ${trayScaleOf(it).toFixed(3)});width:calc(var(--t) * ${(it.ratio*trayScaleOf(it)).toFixed(3)})">${OWNER?`<span class="del" role="button" tabindex="0" aria-label="Delete picture">×</span>`:""}${OWNER?`<span class="types">${["door","window","stairs"].map(t=>`<span role="button" tabindex="0" data-type="${t}" class="${types[typeKey(it)]===t?"on":""}" title="${t}" aria-label="${t}">${t[0].toUpperCase()}</span>`).join("")}</span>`:""}</button>`).join("")+
    (items.length?"":`<p class="emptyNote">No stickers yet. Add PNG files in the settings${ALLOW_UPLOAD?" or press + to try some from your computer":""}.</p>`)+
    (ALLOW_UPLOAD?`<label class="add" title="Add PNG">+<input type="file" id="upload" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" multiple aria-label="Add PNG stickers"></label>`:"")+
    (OWNER?`<p class="ownerLine">removed: ${removed.length} - <a id="copyRemoved">copy list</a> - <a id="undoRemoved">undo all</a></p>`:"");
}
function bindSheet(){
  sheet.querySelectorAll(".sticker").forEach(el=>{el.addEventListener("pointerdown",startDrag);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();autoPlace(el.dataset.id)}})});
  sheet.querySelectorAll(".del").forEach(x=>{const id=x.parentElement.dataset.id;
    x.addEventListener("pointerdown",e=>e.stopPropagation());
    x.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();removeItem(id)});
    x.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();removeItem(id)}})});
  sheet.querySelectorAll(".types span").forEach(b=>{const id=b.closest(".sticker").dataset.id;
    b.addEventListener("pointerdown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)});
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();toggleType(id,b.dataset.type)}})});
  $("#copyRemoved")?.addEventListener("click",copyRemoved);
  $("#undoRemoved")?.addEventListener("click",undoRemoved);
  const up=$("#upload"); if(up) up.addEventListener("change",()=>{addFiles(up.files);up.value=""});
}
function renderPlaced(popId){
  // wallpapers live in the house viewBox: image = room rect, clipped by the room rect
  SY=measureStretch();
  // on a stretched phone house the image is drawn SY times taller and squeezed back by the stretch, so it is not distorted
  wallsEl.innerHTML=`<defs>${ROOMS.map(r=>`<clipPath id="clip-${r.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/></clipPath>`).join("")}
    <clipPath id="clip-tower"><rect x="${TOWER.x}" y="${TOWER.y}" width="${TOWER.w}" height="${TOWER.h}"/></clipPath></defs>`+
    items.filter(it=>it.wall&&pos[it.id]).map(it=>{const id=pos[it.id].room,b=ROOMS.find(r=>r.id===id)||TOWER;
    const cls=(popId===it.id?"pop":"")+(videoRoom&&id===videoRoom?" gone":"");
    const img=`<image href="${it.src}" data-id="${it.id}" class="${cls}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"
      preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-${id})"/>`;
    return SY===1?img:`<g clip-path="url(#clip-${id})"><image href="${it.src}" data-id="${it.id}" class="${cls}" x="${b.x}" y="${b.y*SY}" width="${b.w}" height="${b.h*SY}"
      preserveAspectRatio="xMidYMid slice" transform="scale(1 ${1/SY})"/></g>`}).join("");
  wallsEl.querySelectorAll("image").forEach(el=>el.addEventListener("pointerdown",startDrag));
  placedEl.innerHTML=placedOrder().map(it=>{const p=pos[it.id],{hy}=sizeOf(it);
    if(p.slot){const sl=SLOTS.find(s=>s.id===p.slot); if(sl)slotPos(it,sl)}
    return `<img src="${it.src}" alt="" draggable="false" data-id="${it.id}" class="${(popId===it.id?"pop":"")+(videoRoom&&p.room===videoRoom?" gone":"")}"
      style="left:${(p.x-VB.x)/VB.w*100}%;top:${(p.y-VB.y)/VB.h*100}%;height:${hy/VB.h*100}%">`}).join("");
  placedEl.querySelectorAll("img").forEach(el=>el.addEventListener("pointerdown",startDrag));
  updateHud();
}
function render(popId){renderSheet();renderPlaced(popId)}
// dropped stickers back to front (pos.z, set by the editor's front / backward buttons; same z → sheet order)
function placedOrder(){return items.filter(it=>!it.wall&&pos[it.id]).sort((a,b)=>(pos[a.id].z||0)-(pos[b.id].z||0))}
function placedCount(){return items.filter(it=>pos[it.id]).length}
function allPlaced(){return items.length>0&&placedCount()===items.length}
function updateHud(){ $("#progress").textContent=`${placedCount()} / ${items.length} placed`; $("#random").disabled=!items.some(it=>!pos[it.id]); }

/* ---------------- drag ---------------- */
let drag=null;
function startDrag(e){
  if(alive)return; const el=e.currentTarget, it=items.find(i=>i.id===el.dataset.id); if(!it||!it.ready)return;
  if(el.classList.contains("sticker")&&pos[it.id])return;
  el.setPointerCapture(e.pointerId);
  const gh=new Image(); gh.src=it.src; gh.className="ghost"; gh.style.height=sizeOf(it).h*scale()+"px"; document.body.appendChild(gh);
  drag={el,it,gh,x0:e.clientX,y0:e.clientY,moved:false,fromHouse:!!pos[it.id]};
  moveGhost(e.clientX,e.clientY);
  el.onpointermove=ev=>{ if(!drag.moved&&Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)>6){drag.moved=true; if(drag.fromHouse)el.classList.add("lift")}
    moveGhost(ev.clientX,ev.clientY); const [x,y]=toCanvas(ev.clientX,ev.clientY); hot(roomAt(x,y)) };
  el.onpointerup=ev=>endDrag(ev); el.onpointercancel=()=>endDrag(null);
}
function moveGhost(x,y){drag.gh.style.left=x+"px";drag.gh.style.top=y+"px"}
function hot(room){document.querySelectorAll(".zone").forEach(z=>z.classList.toggle("hot",!!room&&z.dataset.room===room.id))}
function endDrag(ev){
  const d=drag; drag=null; d.el.onpointermove=d.el.onpointerup=d.el.onpointercancel=null; hot(null);
  if(ev&&!d.moved){ d.gh.remove(); if(EDIT&&!d.fromHouse)return; if(d.fromHouse){delete pos[d.it.id];render()} else autoPlace(d.it.id); return }
  const [x,y]=ev?toCanvas(ev.clientX,ev.clientY):[-1,-1], room=ev&&roomAt(x,y);
  // wallpapers need a room or the tower; objects stay anywhere on the stage except over the sheet
  if(d.it.wall?room:ev&&!inRect(ev.clientX,ev.clientY,sheet)&&inRect(ev.clientX,ev.clientY,stage)){ d.gh.remove(); const sl=slotAt(d.it,x,y); if(sl)putSlot(d.it,sl); else put(d.it,room,x,y); render(d.it.id); checkDone(); return }
  // otherwise → back to the sheet
  delete pos[d.it.id]; render();
  const home=sheet.querySelector(`[data-id="${d.it.id}"]`)?.getBoundingClientRect();
  if(home){ d.gh.classList.add("back"); Object.assign(d.gh.style,{left:home.left+home.width/2+"px",top:home.top+home.height/2+"px",opacity:"0"}); setTimeout(()=>d.gh.remove(),260) } else d.gh.remove();
}
function autoPlace(id){ if(alive)return; const it=items.find(i=>i.id===id); if(!it||!it.ready||pos[id])return;
  const rooms=it.wall?[...ROOMS,TOWER].filter(r=>!items.some(o=>o.wall&&pos[o.id]?.room===r.id)):ROOMS; if(!rooms.length)return;
  const counts=rooms.map(r=>items.filter(i=>pos[i.id]?.room===r.id).length), min=Math.min(...counts);
  const choices=rooms.filter((r,i)=>counts[i]===min), room=choices[Math.floor(Math.random()*choices.length)];
  const {w,hy}=sizeOf(it); // objects: inside the room, standing on its floor
  put(it,room,room.x+w/2+4+Math.random()*Math.max(0,room.w-w-8),room.y+room.h-2-hy/2);
  render(id); checkDone();
}

/* ---------------- test uploads ---------------- */
function addFiles(files){
  [...files].filter(f=>/^image\//.test(f.type)).forEach(f=>{
    const src=URL.createObjectURL(f), it={id:"u"+Math.random().toString(36).slice(2,8),src,name:f.name,type:f.type,h:UPLOAD_HEIGHT*K,snap:"auto",ratio:1,wall:false,ready:false,upload:true,blob:f,added:Date.now()};
    items.push(it); measure(it);
  }); render();
}
function removeUpload(id){
  if(alive)return; const it=items.find(i=>i.id===id); if(!it||!it.upload)return;
  items=items.filter(i=>i!==it); delete pos[id]; URL.revokeObjectURL(it.src); dbDel(id);
  if(types[id]){delete types[id]; lsSet("dollhouse-types",types)} render();
}
function removeItem(id){ // owner mode only. uploads: delete; built-ins: hide in this browser
  if(!OWNER)return; const it=items.find(i=>i.id===id); if(!it)return; if(it.upload)return removeUpload(id);
  if(alive||!OWNER)return; items=items.filter(i=>i!==it); delete pos[id];
  if(!removed.includes(it.src)){removed.push(it.src); lsSet("dollhouse-removed",removed)} render();
}
function undoRemoved(){ if(alive)return; removed=[]; lsSet("dollhouse-removed",null); items=[...builtins,...items.filter(i=>i.upload)]; render() }
function copyRemoved(){
  const text=removed.map(s=>s.split("/").pop()).join("\n"), done=()=>{const a=$("#copyRemoved"); if(a){a.textContent="copied"; setTimeout(()=>{if(a.isConnected)a.textContent="copy list"},1200)}};
  const fallback=()=>{const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy")}catch(e){} t.remove(); done()};
  navigator.clipboard?navigator.clipboard.writeText(text).then(done,fallback):fallback();
}
function toggleType(id,t){ // mark a picture as door / window / stairs (overrides the file-name rule); again clears it
  const it=items.find(i=>i.id===id); if(!it)return; const k=typeKey(it);
  if(types[k]===t)delete types[k]; else types[k]=t; lsSet("dollhouse-types",types); renderSheet();
}
// saved uploads: IndexedDB "dollhouse" / "uploads", key = item id. Any failure → behave as without saving.
let dbP=null;
function db(){ if(!dbP) dbP=new Promise((ok,no)=>{const r=indexedDB.open("dollhouse",1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("uploads"))r.result.createObjectStore("uploads")};
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error)}); return dbP }
function dbTx(mode,fn){ try{ return db().then(d=>new Promise((ok,no)=>{const t=d.transaction("uploads",mode),req=fn(t.objectStore("uploads"));
    t.oncomplete=()=>ok(req&&req.result); t.onerror=t.onabort=()=>no(t.error)})).catch(()=>{}) }catch(e){ return Promise.resolve() } }
function dbPut(it){ if(items.includes(it)) dbTx("readwrite",s=>s.put({id:it.id,blob:it.blob,name:it.name,type:it.type,wall:it.wall,added:it.added},it.id)) }
function dbDel(id){ dbTx("readwrite",s=>s.delete(id)) }
function loadUploads(){ return dbTx("readonly",s=>s.getAll()).then(rows=>{ if(!rows||!rows.length)return;
  rows.sort((a,b)=>(a.added||0)-(b.added||0)).forEach(r=>{ if(!r||!r.blob||items.some(i=>i.id===r.id))return;
    const it={id:r.id,src:URL.createObjectURL(r.blob),name:r.name||"",type:r.type||r.blob.type,h:UPLOAD_HEIGHT*K,snap:"auto",ratio:1,wall:!!r.wall,ready:false,upload:true,blob:r.blob,added:r.added||0,saved:true};
    items.push(it); measure(it); });
  render(); }) }
if(ALLOW_UPLOAD){
  sheet.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("Files"))e.preventDefault()});
  sheet.addEventListener("drop",e=>{if(!e.dataTransfer.files.length)return;e.preventDefault();addFiles(e.dataTransfer.files)});
}
function opaque(im){ // fewer than 1% of pixels with alpha < 250 → no transparency
  const k=64/Math.max(im.naturalWidth||64,im.naturalHeight||64,64), w=Math.max(1,Math.round((im.naturalWidth||64)*k)), h=Math.max(1,Math.round((im.naturalHeight||64)*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(im,0,0,w,h);
  const a=g.getImageData(0,0,w,h).data; let n=0; for(let i=3;i<a.length;i+=4) if(a[i]<250) n++;
  return n<w*h*.01;
}
function measure(it){const im=new Image(); im.onload=()=>{it.ratio=im.naturalWidth/im.naturalHeight||1;
    if(neverWall(it)) it.wall=false;
    else if(!it.saved){ if(isWall(it.name)||isJpeg(it.name,it.type)) it.wall=true; else try{it.wall=opaque(im)}catch(e){it.wall=false} }
    it.ready=true; if(it.upload&&!it.saved){it.saved=true; dbPut(it)} render(); checkLoaded()};
  im.onerror=()=>{if(neverWall(it))it.wall=false; else if(!it.saved)it.wall=isWall(it.name)||isJpeg(it.name,it.type); it.ready=true; if(it.upload&&!it.saved){it.saved=true; dbPut(it)} render(); checkLoaded()}; im.src=it.src}

/* ---------------- loading widget ---------------- */
let uploadsDone=!ALLOW_UPLOAD;
function hideLoader(){ const l=$("#loader"); if(!l||l.classList.contains("out"))return; l.classList.add("out"); setTimeout(()=>l.remove(),200) }
let houseDone=false; // scene layers loaded and decoded (or failed)
function checkLoaded(){ if(houseDone&&uploadsDone&&items.every(it=>it.ready)) hideLoader() }
setTimeout(hideLoader,8000); // failsafe

/* ---------------- the house comes alive ---------------- */
function checkDone(){ if(allPlaced()) setTimeout(wake,500) }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wake(){
  if(alive||!allPlaced())return; alive=true; sheet.classList.add("locked");
  wrap.classList.add("alive");
  finaleT=setTimeout(startFinale,1200);
}
/* room video: one muted autoplay <video> in the video room, nothing is loaded before the finale.
   Its stickers fade out; tapping the room turns its sound on / off. */
let finaleT, video=null, soundOn=false, finaleGen=0;
const HOW=$(".how").textContent, boxOf=id=>ROOMS.find(r=>r.id===id)||TOWER;
const boxStyle=r=>({left:(r.x-VB.x)/VB.w*100+"%",top:(r.y-VB.y)/VB.h*100+"%",width:r.w/VB.w*100+"%",height:r.h/VB.h*100+"%"});
function startFinale(){
  if(!alive)return; stopFinale(); const gen=finaleGen;
  const id=Object.keys(ROOM_VIDEOS).find(k=>[...ROOMS,TOWER].some(r=>r.id===k)); if(!id)return;
  const el=video=document.createElement("video"); el.muted=true; el.loop=true; el.playsInline=true; el.autoplay=true;
  ["muted","loop","playsinline","autoplay"].forEach(a=>el.setAttribute(a,"")); el.src=ROOM_VIDEOS[id];
  el.dataset.room=id; Object.assign(el.style,boxStyle(boxOf(id))); screens.appendChild(el);
  videoRoom=id; renderPlaced();
  setTimeout(()=>{if(gen===finaleGen)el.classList.add("on")},150);
  el.play().catch(()=>{});
  $(".how").textContent="Tap the room to hear it.";
}
function setSound(){ // tapping the video room turns its sound on; tapping it again mutes it
  if(!video)return; soundOn=!soundOn; video.muted=!soundOn; if(soundOn) video.play().catch(()=>{});
  stage.querySelector(".tag")?.remove();
  if(soundOn){ const r=boxOf(videoRoom), t=document.createElement("span"); t.className="tag"; t.textContent="sound on";
    Object.assign(t.style,{left:(r.x-VB.x)/VB.w*100+"%",top:(r.y-VB.y)/VB.h*100+"%"}); stage.appendChild(t) }
}
function stopFinale(){
  finaleGen++; clearTimeout(finaleT); soundOn=false;
  if(video){ video.pause(); video.removeAttribute("src"); video.load(); video=null }
  screens.innerHTML=""; stage.querySelector(".tag")?.remove(); $(".how").textContent=HOW;
  if(videoRoom){ videoRoom=null; renderPlaced() }
}
stage.addEventListener("click",e=>{ if(!alive||!video||e.target.closest("button"))return;

function reset(){

    ${sec("house","House group",`<h4>scale % (house, stairs, rooms and everything dropped inside)</h4>${rng("ehg",10,300,1)}`)}
    ${sec("toolbar","Toolbar",`<h4>toolbar height</h4>${rng("etb",.3,4,.05)}
    <h4>all tray items size</h4>${rng("eta",.2,5,.05)}
    <h4>tray item: <span id="etrayname"></span></h4>${rng("eti",.1,8,.05)}`)}</div>`;
  document.body.appendChild(panel);
  // panel: collapse (H, round button), drag by its header, dock left/right, sections remembered, always kept on screen
  const pbtn=document.createElement("button"); pbtn.className="epanelBtn"; pbtn.type="button"; pbtn.title="Show editor panel (H)"; pbtn.textContent="☰";
  document.body.appendChild(pbtn);
  let pst={dock:"right",x:null,y:null,collapsed:false,...lsGet("dollhouse-epanel",{})};
  const keepOnScreen=()=>{ if(pst.x==null)return; const r=panel.getBoundingClientRect();
    pst.x=Math.max(0,Math.min(innerWidth-r.width,pst.x)); pst.y=Math.max(0,Math.min(innerHeight-r.height,pst.y)); panel.style.left=pst.x+"px"; panel.style.top=pst.y+"px" };
  const applyPanel=()=>{ const left=pst.dock==="left";
    panel.classList.toggle("left",left); pbtn.classList.toggle("left",left);
    panel.classList.toggle("collapsed",pst.collapsed); pbtn.classList.toggle("on",pst.collapsed);
    panel.style.left=panel.style.top=panel.style.right=""; if(pst.x!=null){panel.style.right="auto"; keepOnScreen()}
    $("#edock").textContent=left?"dock right":"dock left"; lsSet("dollhouse-epanel",pst); drawSel() };
  const togglePanel=()=>{pst.collapsed=!pst.collapsed; applyPanel()};
  $("#ecollapse").onclick=togglePanel; pbtn.onclick=togglePanel;
  $("#edock").onclick=()=>{pst.dock=pst.dock==="left"?"right":"left"; pst.x=pst.y=null; applyPanel()};
  panel.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{secOpen[d.dataset.sec]=d.open; lsSet("dollhouse-epanel-secs",secOpen); keepOnScreen()}));
  const head=panel.querySelector(".ehead");
  head.addEventListener("pointerdown",e=>{ if(e.target.closest("button"))return; e.preventDefault(); head.setPointerCapture(e.pointerId);
    const r=panel.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
    const mv=ev=>{pst.x=ev.clientX-dx; pst.y=ev.clientY-dy; panel.style.right="auto"; keepOnScreen(); drawSel()};
    const end=()=>{head.removeEventListener("pointermove",mv); head.removeEventListener("pointerup",end); head.removeEventListener("pointercancel",end); lsSet("dollhouse-epanel",pst)};
    head.addEventListener("pointermove",mv); head.addEventListener("pointerup",end); head.addEventListener("pointercancel",end) });
  addEventListener("resize",keepOnScreen);
  addEventListener("keydown",e=>{ if(e.target.closest&&e.target.closest("input,textarea"))return; if(e.key.toLowerCase()==="h"&&!e.metaKey&&!e.ctrlKey&&!e.altKey)togglePanel() });
  applyPanel();
  panel.querySelectorAll(".ll label").forEach(lb=>{ const n=lb.dataset.name, cb=lb.querySelector("input");
    cb.addEventListener("click",e=>e.stopPropagation());
    cb.addEventListener("change",()=>{ cb.checked?hiddenEd.delete(n):hiddenEd.add(n); applyLayers() });
    lb.addEventListener("click",e=>{ if(e.target===cb)return; e.preventDefault(); if(e.shiftKey){sel.has(n)?sel.delete(n):sel.add(n)} else sel=new Set([n]); drawSel(); syncPanel(); $("#estatus").textContent=[...sel].join(", ") }) });
  $("#elift").onchange=e=>{liftOn=e.target.checked};
  $("#elinklegs").checked=linkLegs; $("#elinklegs").onchange=e=>{linkLegs=e.target.checked; lsSet("dollhouse-link-legs",linkLegs); drawSel(); syncPanel()};
  ["x","y","w","h"].forEach(k=>$("#en"+k).addEventListener("input",e=>{ const v=parseFloat(e.target.value); if(sel.size!==1||!isFinite(v)||(k==="w"||k==="h")&&v<=0)return;
    const n=[...sel][0], b={...box(n)}; if(n===HG&&k==="h")b.w=b.w*v/b.h; else b[k]=v; setBox(n,b); applyLayers(); saveDraft(); useLayers(LAYERS); renderPlaced() }));
  ["ehg","ehgn"].forEach(i=>$("#"+i).addEventListener("input",e=>{const v=parseFloat(e.target.value); if(!isFinite(v)||v<10||v>500)return;
    setGroupScale(v/100); applyLayers(); saveDraft(); useLayers(LAYERS); renderPlaced() }));
  $("#ehouse").onclick=()=>{sel=new Set([HG]); drawSel(); syncPanel(); $("#estatus").textContent="house group: drag to move · corners scale"};
  const trayChanged=()=>{ renderSheet(); saveDraft(); syncPanel() };
  const pair=(id,get,set)=>[id,id+"n"].forEach(i=>$("#"+i).addEventListener("input",e=>{const v=parseFloat(e.target.value); if(!isFinite(v)||v<=0)return; set(v); trayChanged()}));
  pair("etb",0,v=>{TRAY.toolbarScale=v}); pair("eta",0,v=>{TRAY.trayItemsScale=v});
  pair("eti",0,v=>{ if(!traySel)return; if(Math.abs(v-1)<1e-3)delete TRAY.trayItems[traySel]; else TRAY.trayItems[traySel]=v });
  // tray: in the editor a click selects an item (tray size); dragging it still drops it into the house
  sheet.addEventListener("pointerdown",e=>{ const st=e.target.closest(".sticker"); if(!st)return;
    const it=items.find(i=>i.id===st.dataset.id); traySel=it&&trayKey(it); sheet.querySelectorAll(".sticker").forEach(s=>s.classList.toggle("tsel",s===st&&!!traySel)); syncPanel() },true);
  syncPanel();
  const selectAll=()=>{sel=new Set(editable()); drawSel()};
  $("#eall").onclick=selectAll;
  $("#ezoom").oninput=e=>setZoom(e.target.value/100);
  $("#ereset").onclick=()=>{ lsSet(DRAFT_KEY,null); TRAY={...fileTray,trayItems:{...fileTray.trayItems}}; GROUP={...fileGroup}; renderSheet(); useLayers(fileLayers); sel.clear(); drawSel(); zoom=1; panX=panY=0; applyView(); renderPlaced(); $("#estatus").textContent="reset to the published layout" };
  $("#esave").onclick=saveLayout;
  let space=false, nudgeT;
  const commitSoon=()=>{clearTimeout(nudgeT); nudgeT=setTimeout(()=>{saveDraft(); useLayers(LAYERS); renderPlaced()},250)};
  const setSizePct=v=>{ const pn=opNames()[0]; if(!pn||!isFinite(v))return; v=Math.min(1000,Math.max(5,v)); const cur=sizePct(pn); if(cur>0) scaleSel(v/cur); applyLayers(); commitSoon() };
  ["esz","eszn"].forEach(i=>$("#"+i).addEventListener("input",e=>setSizePct(parseFloat(e.target.value))));
  $("#esminus").onclick=()=>{const pn=opNames()[0]; if(pn) setSizePct(Math.round(sizePct(pn)/5)*5-5)};
  $("#esplus").onclick=()=>{const pn=opNames()[0]; if(pn) setSizePct(Math.round(sizePct(pn)/5)*5+5)};
  const dropSel=()=>sel.size===1&&isDrop([...sel][0])?[...sel][0]:null;
  $("#efront").onclick=()=>{const n=dropSel(); if(n){dropOrder(n,1); drawSel()}};
  $("#eback").onclick=()=>{const n=dropSel(); if(n){dropOrder(n,-1); drawSel()}};
  $("#eremove").onclick=()=>{const n=dropSel(), it=n&&dropIt(n); if(!it)return; delete pos[it.id]; sel.delete(n); render(); drawSel(); syncPanel()};
  addEventListener("keydown",e=>{ if(e.target.closest&&e.target.closest("input,textarea"))return;
    const ar={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(ar&&sel.size){ e.preventDefault(); const st=e.shiftKey?100:10; opNames().forEach(n=>{const b=box(n); setBox(n,{...b,x:b.x+ar[0]*st,y:b.y+ar[1]*st})}); applyLayers(); clearTimeout(nudgeT); nudgeT=setTimeout(()=>{saveDraft(); useLayers(LAYERS); renderPlaced()},250); return }
    if(e.key===" "){space=true; e.preventDefault()}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="a"){e.preventDefault(); selectAll()}
    else if(e.key==="Escape"){sel.clear(); drawSel()} });
  addEventListener("keyup",e=>{if(e.key===" ")space=false});
  // drag / scale / pan / two-finger pinch, all in artboard units
  const pts=new Map(); let op=null;
  const fade=on=>document.body.classList.toggle("edrag",on);
  wrap.addEventListener("pointerdown",e=>{
    if(e.target.closest(".etools,.epanel"))return;
    e.preventDefault(); e.stopPropagation(); wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()], d0=Math.hypot(a[0]-b[0],a[1]-b[1])||1, [mx,my]=toArt((a[0]+b[0])/2,(a[1]+b[1])/2), sb=sel.size?selBox():null;
      // two fingers over the selection size it, elsewhere they zoom the view
      if(sb&&mx>=sb.x&&my>=sb.y&&mx<=sb.x+sb.w&&my<=sb.y+sb.h){ op={type:"pinchSel",d0,o:Object.fromEntries(opNames().map(n=>[n,{...box(n)}]))}; return }
      op={type:"pinch",d0,z0:zoom}; return }
    if(pts.size>2)return;
    if(space||e.altKey||e.button===1){ op={type:"pan",x:e.clientX,y:e.clientY,px:panX,py:panY}; return }
    const [x,y]=toArt(e.clientX,e.clientY), h=e.target.dataset&&e.target.dataset.h;
    const orig=()=>Object.fromEntries(opNames().map(n=>[n,{...box(n)}]));
    if(h&&sel.size){ const b=selBox(), c=[b.x+(h.includes("e")?b.w:0),b.y+(h.includes("s")?b.h:0)], a=[b.x+(h.includes("e")?0:b.w),b.y+(h.includes("s")?0:b.h)];
      op={type:"size",a,c,x,y,o:orig()}; fade(true); return }
    const dh=hitDrop(x,y); // dropped stickers are in front of every layer
    const inSel=!e.shiftKey&&(dh?sel.has(dh):[...sel].some(n=>{const l=box(n); if(n===HG)return x>=l.x&&y>=l.y&&x<=l.x+l.w&&y<=l.y+l.h; return !edHidden(n)&&x>=l.x&&y>=l.y&&x<=l.x+l.w&&y<=l.y+l.h&&alphaAt(n,(x-l.x)/l.w,(y-l.y)/l.h)>16}));
    if(inSel){ op={type:"move",x,y,o:orig()}; fade(true); if(liftOn)lift=new Set(sel); applyLayers(); return }
    const hit=dh||hitTest(x,y);
    if(!hit){ if(!e.shiftKey)sel.clear(); drawSel(); op=null; return }
    if(e.shiftKey){ sel.has(hit)?sel.delete(hit):sel.add(hit) } else if(!sel.has(hit)) sel=new Set([hit]);
    drawSel(); op=sel.size?{type:"move",x,y,o:orig()}:null; fade(!!op); if(op&&liftOn){lift=new Set(sel); applyLayers()}
    $("#estatus").textContent=[...sel].join(", ");
  },true);
  wrap.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return; pts.set(e.pointerId,[e.clientX,e.clientY]); if(!op)return;
    if(op.type==="pinch"){ if(pts.size<2)return; const [a,b]=[...pts.values()]; setZoom(op.z0*Math.hypot(a[0]-b[0],a[1]-b[1])/op.d0,(a[0]+b[0])/2,(a[1]+b[1])/2); return }
    if(op.type==="pinchSel"){ if(pts.size<2)return; const [a,b]=[...pts.values()]; scaleSel(Math.hypot(a[0]-b[0],a[1]-b[1])/op.d0,op.o); applyLayers(); return }
    if(op.type==="pan"){ panX=op.px+e.clientX-op.x; panY=op.py+e.clientY-op.y; applyView(); return }
    const [x,y]=toArt(e.clientX,e.clientY);
    if(op.type==="move"){ for(const n in op.o){const q=op.o[n]; setBox(n,{...q,x:q.x+x-op.x,y:q.y+y-op.y})} }
    else { // relative to where the handle was grabbed (it may be drawn inside the window rather than at the real corner)
      const {a,c}=op, vx=c[0]-a[0], vy=c[1]-a[1], pr=(px,py)=>(px-a[0])*vx+(py-a[1])*vy, s=Math.max(.05,pr(x,y)/(pr(op.x,op.y)||1));
      // shift = free resize (width and height separately); the house group always keeps its aspect
      const free=e.shiftKey&&!sel.has(HG), sx=free?Math.max(.05,(x-a[0])/((op.x-a[0])||1)):s, sy=free?Math.max(.05,(y-a[1])/((op.y-a[1])||1)):s;
      for(const n in op.o){const q=op.o[n]; setBox(n,{x:a[0]+(q.x-a[0])*sx,y:a[1]+(q.y-a[1])*sy,w:q.w*sx,h:q.h*sy})} }
    applyLayers();
  },true);
  const up=e=>{ if(!pts.delete(e.pointerId))return; if(op&&op.type!=="pinch"||!pts.size){ if(op&&op.type!=="pan"&&op.type!=="pinch"){saveDraft(); useLayers(LAYERS)} op=null; fade(false); if(lift.size){lift.clear(); applyLayers()} } };
  wrap.addEventListener("pointerup",up,true); wrap.addEventListener("pointercancel",up,true);
  wrap.addEventListener("click",e=>e.stopPropagation(),true);
  // wheel / trackpad pinch (ctrl+wheel) / Safari gesture zoom, about the pointer
  // alt / cmd + wheel over the selection sizes it instead
  wrap.addEventListener("wheel",e=>{e.preventDefault();
    if((e.altKey||e.metaKey)&&!e.ctrlKey&&sel.size){ const [x,y]=toArt(e.clientX,e.clientY), b=selBox();
      if(x>=b.x&&y>=b.y&&x<=b.x+b.w&&y<=b.y+b.h){ scaleSel(Math.exp(-(e.deltaY||e.deltaX)*.0015)); applyLayers(); commitSoon(); return } }
    setZoom(zoom*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY)},{passive:false});
  let g0=1; wrap.addEventListener("gesturestart",e=>{e.preventDefault(); g0=zoom});
  wrap.addEventListener("gesturechange",e=>{e.preventDefault(); setZoom(g0*e.scale,e.clientX,e.clientY)});
  wrap.style.touchAction="none";
}

drawHouse(); builtins.forEach(measure); render();
if(ALLOW_UPLOAD) loadUploads().finally(()=>{uploadsDone=true; checkLoaded()}); else checkLoaded();
